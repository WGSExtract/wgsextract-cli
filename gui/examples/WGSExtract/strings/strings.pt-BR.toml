"controls.microarray.post-v063.filtered.label" = "No-call filtered VCF records"  # i18n-ignore; TODO: translate
"controls.microarray.post-v063.filtered.tooltip" = "Opt in to no-calls for VCF FILTER values other than PASS or dot. Unchecked preserves CLI/config defaults."  # i18n-ignore; TODO: translate
"controls.microarray.post-v063.reasons.label" = "Write call/no-call reasons"  # i18n-ignore; TODO: translate
"controls.microarray.post-v063.reasons.tooltip" = "Opt in to a companion CombinedKit_reasons.tsv report. Unchecked preserves CLI/config defaults."  # i18n-ignore; TODO: translate
