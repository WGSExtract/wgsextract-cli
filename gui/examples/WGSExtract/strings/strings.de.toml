"controls.extract.post-v063.poz.tooltip" = "Y BAM only: opt in to the licensed CombBED/McDonald/Poznik union on GRCh37 or GRCh38. Other builds are rejected; unchecked keeps whole-Y extraction."  # i18n-ignore; TODO: translate
