"controls.settings.post-v063.atomic.label" = "Publish main outputs atomically"  # i18n-ignore; TODO: translate
"controls.settings.post-v063.atomic.tooltip" = "Opt in to publishing completed main outputs by rename. Staged tool provenance paths may differ. Default is off; CLI still protects existing outputs and cleans failed work."  # i18n-ignore; TODO: translate
"controls.settings.post-v063.awake.label" = "Keep awake during commands"  # i18n-ignore; TODO: translate
