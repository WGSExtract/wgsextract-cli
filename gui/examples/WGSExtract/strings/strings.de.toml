"controls.extract.post-v063.fastq.tooltip" = "Unmapped extraction only: also write paired, single-end and singleton FASTQs. Unchecked keeps the existing alignment-only output."  # i18n-ignore; TODO: translate
"sections.fastq.post-v063.multiqc.title" = "Aggregate FastQC reports"  # i18n-ignore; TODO: translate
