"controls.vcf.post-v063.scatter.label" = "Scatter Ultima GATK intervals"  # i18n-ignore; TODO: translate
"controls.vcf.post-v063.scatter.tooltip" = "GATK only, Ultima flow-tagged inputs: opt in to interval scattering bounded by threads and RAM (6 GiB per worker; 4 GiB Java heap). Genotypes and annotations can change away from interval boundaries. Unchecked runs one unscattered process."  # i18n-ignore; TODO: translate
"controls.ancestry.post-v063.tree-links.label" = "Print lineage tree links"  # i18n-ignore; TODO: translate
