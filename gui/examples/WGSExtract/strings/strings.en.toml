"controls.microarray.post-v063.min-gq.label" = "Minimum genotype quality (GQ)"
"controls.microarray.post-v063.min-gq.tooltip" = "Optional non-negative integer; blank preserves CLI/config defaults (0 disables filtering). Missing GQ becomes a no-call when filtering is enabled."
"controls.microarray.post-v063.min-dp.label" = "Minimum sample depth (DP)"
"controls.microarray.post-v063.min-dp.tooltip" = "Optional non-negative integer; blank preserves CLI/config defaults (0 disables filtering). Missing DP becomes a no-call when filtering is enabled."
"controls.microarray.post-v063.strand.label" = "No-call strand-ambiguous SNPs"
"controls.microarray.post-v063.strand.tooltip" = "Opt in to no-calls for known biallelic A/T and C/G input SNPs. Unknown probe alleles are not inferred; unchecked preserves CLI/config defaults."
"controls.microarray.post-v063.rsids.label" = "Resolve historical rsIDs"
"controls.microarray.post-v063.rsids.tooltip" = "Opt in to packaged dbSNP alias resolution; retired or ambiguous marker IDs become no-calls. Unchecked preserves CLI/config defaults."
"controls.microarray.post-v063.absent.label" = "No-call absent VCF markers"
"controls.microarray.post-v063.absent.tooltip" = "Opt out of assuming homozygous reference for absent VCF markers on represented contigs. Unchecked preserves CLI/config defaults (assume reference)."
"controls.microarray.post-v063.filtered.label" = "No-call filtered VCF records"
"controls.microarray.post-v063.filtered.tooltip" = "Opt in to no-calls for VCF FILTER values other than PASS or dot. Unchecked preserves CLI/config defaults."
"controls.microarray.post-v063.reasons.label" = "Write call/no-call reasons"
"controls.microarray.post-v063.reasons.tooltip" = "Opt in to a companion CombinedKit_reasons.tsv report. Unchecked preserves CLI/config defaults."
"controls.microarray.post-v063.aadr-sample.label" = "AADR sample label"
"controls.microarray.post-v063.aadr-sample.tooltip" = "Only for AADR exports. Use a non-identifying label: 1-39 ASCII letters, digits, dots, underscores or hyphens, starting with a letter or digit. Blank uses sample."
"controls.microarray.post-v063.aadr-sex.label" = "AADR metadata sex (U, M or F)"
"controls.microarray.post-v063.aadr-sex.tooltip" = "Only for AADR exports: U (unknown), M or F. Metadata only; does not change genotype calling. Blank uses U."
"controls.extract.post-v063.poz.label" = "Restrict Y BAM to Poz regions"
"controls.extract.post-v063.poz.tooltip" = "Y BAM only: opt in to the licensed CombBED/McDonald/Poznik union on GRCh37 or GRCh38. Other builds are rejected; unchecked keeps whole-Y extraction."
"controls.extract.post-v063.ybrowse.label" = "Annotate VCF with yBrowse SNP names"
"controls.extract.post-v063.ybrowse.tooltip" = "Y VCF only: opt in to allele-annotated yBrowse targets with an indexed matching GRCh38 reference. Install the yBrowse reference resource first; this action never downloads it."
"controls.extract.post-v063.fastq.label" = "Include unmatched read segments"
"controls.extract.post-v063.fastq.tooltip" = "Unmapped extraction only: also write paired, single-end and singleton FASTQs. Unchecked keeps the existing alignment-only output."
"sections.fastq.post-v063.multiqc.title" = "Aggregate FastQC reports"
"controls.fastq.post-v063.multiqc-input.tooltip" = "Select an existing FastQC report or directory of reports, not raw FASTQs. MultiQC must already be available in the CLI runtime."
"controls.fastq.post-v063.multiqc-force.label" = "Replace existing MultiQC report"
"controls.fastq.post-v063.multiqc-force.tooltip" = "Opt in to replacing multiqc_report.html. Otherwise choose a new output directory; existing reports are protected."
"actions.fastq.post-v063.multiqc.title" = "Create offline MultiQC report"
"actions.fastq.post-v063.multiqc.tooltip" = "Combine existing FastQC reports into local multiqc_report.html. FastQC-only aggregation; uploads, AI summaries and version checks are disabled."
"controls.vcf.post-v063.scatter.label" = "Scatter Ultima GATK intervals"
"controls.vcf.post-v063.scatter.tooltip" = "GATK only, Ultima flow-tagged inputs: opt in to interval scattering bounded by threads and RAM (6 GiB per worker; 4 GiB Java heap). Genotypes and annotations can change away from interval boundaries. Unchecked runs one unscattered process."
"controls.ancestry.post-v063.tree-links.label" = "Print lineage tree links"
"controls.ancestry.post-v063.tree-links.tooltip" = "Opt in to YFull/FTDNA Y-tree links or a YFull mtDNA tree link in command output. Links are printed, not opened automatically."
"controls.settings.post-v063.temp.label" = "Temporary workload directory"
"controls.settings.post-v063.temp.tooltip" = "Optional existing writable directory for sort spills, GATK and realignment staging. CLI-owned run directories are cleaned up; recoverable failed realign FASTQs may be retained. Blank keeps CLI defaults."
"controls.settings.post-v063.logs.label" = "Persistent run log directory"
"controls.settings.post-v063.logs.tooltip" = "Directory for unique DEBUG logs and companion provenance JSON, one pair per run; the newest 100 runs are kept. Blank disables persistent logs; logs may contain local file paths."
"controls.settings.post-v063.atomic.label" = "Publish main outputs atomically"
"controls.settings.post-v063.atomic.tooltip" = "Opt in to publishing completed main outputs by rename. Staged tool provenance paths may differ. Default is off; CLI still protects existing outputs and cleans failed work."
"controls.settings.post-v063.awake.label" = "Keep awake during commands"
"controls.settings.post-v063.awake.tooltip" = "Best-effort sleep inhibition while CLI commands run. Opt in; default is off. Availability depends on the operating system."
"sections.microarray.post-v063.builds.subtitle" = "AADR exports require GRCh37 or GRCh38. For native CHM13 calling, select the CLI-supported pinned CHM13 reference; no generic liftover or extra mode flag is used. Consumer layouts are marker-only unless a matching sequence-defined indel manifest is supplied through the advanced CLI."
"actions.library.post-v063.ybrowse.title" = "Install GRCh38 yBrowse Y-SNP targets"
"actions.library.post-v063.ybrowse.tooltip" = "Explicitly download and verify the CLI's hash-pinned GRCh38 sites-only yBrowse snapshot into the reference library. Other builds are rejected. Nothing is installed unless this action is run."
"actions.library.post-v063.ybrowse-delete.title" = "Delete GRCh38 yBrowse Y-SNP targets"
"actions.library.post-v063.ybrowse-delete.tooltip" = "Delete the installed yBrowse snapshots from the reference library."
"actions.library.post-v063.ybrowse-delete.confirm.title" = "Delete the yBrowse Y-SNP targets?"
"actions.library.post-v063.ybrowse-delete.confirm.message" = "This removes the installed GRCh38 yBrowse snapshots from the selected reference library. They can be installed again later."
"actions.library.post-v063.ybrowse-delete.confirm.confirmButtonTitle" = "Delete"
"actions.library.post-v063.ybrowse-delete.confirm.cancelButtonTitle" = "Cancel"
"controls.microarray.post-v063.indel-format.label" = "I/D manifest output format ID"
"controls.microarray.post-v063.indel-format.tooltip" = "Optional selected consumer format ID, for example myheritage_gsa_2025. Provide its matching manifest below; this opts in to sequence-defined I/D calls. Multiple manifest bindings remain an advanced CLI option."
"controls.microarray.post-v063.indel-manifest.label" = "Matching GRCh37 Illumina I/D manifest"
"controls.microarray.post-v063.indel-manifest.tooltip" = "Optional matching sequence-defined Illumina CSV, gzip or ZIP. Both format ID and file are required to opt in. Do not substitute a marker-only layout; unsupported or ambiguous probes remain no-calls."
"controls.info-bam.post-v063.keep-fastq.label" = "Keep FASTQs extracted by realignment"
"controls.info-bam.post-v063.keep-fastq.tooltip" = "Realign only: opt in to retaining extracted FASTQs in the output directory after success. Unchecked cleans successful CLI-owned temporary FASTQs; failed alignment may retain them for recovery. Refused for Nanopore input, which would lose its MM/ML methylation tags."
"controls.fastq.post-v063.multiqc-file.label" = "Existing FastQC report file"
"controls.fastq.post-v063.multiqc-directory.label" = "Existing FastQC report directory"
"actions.fastq.post-v063.multiqc-directory.title" = "Aggregate report directory"
"sections.microarray.post-v063.aadr-2m.subtitle" = "AADR 2M: its metadata comes with the reference library; GRCh37/38 only. No CHM13; excluded from All."
"options.vcf.v066.auto.title" = "Automatic (detect from reads)"
"options.vcf.v066.config-default.title" = "Use config default"
"controls.vcf.v066.deepvariant-model.label" = "DeepVariant model"
"controls.vcf.v066.deepvariant-model.tooltip" = "Automatic uses ONT_R104 for detected Nanopore reads, ULTIMA for Ultima reads with flow tags, and otherwise WGS. ONT_R104 equals the CLI's --ont: R10.4.1 chemistry only, and x86-64 only (refused on Apple Silicon and ARM64). R9.4.1 is unsupported, and a missing warning does not prove support. DeepVariant does not run on native Windows."
