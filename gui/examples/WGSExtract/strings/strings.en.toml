"actions.info-bam.bam-commands.bam-unindex.tooltip" = "Remove the BAM/CRAM index file to force re-indexing or clean the workspace."
"actions.info-bam.bam-commands.cram-to-bam.title" = "To BAM"
"actions.info-bam.bam-commands.cram-to-bam.tooltip" = "Convert CRAM back to BAM for older tools that do not support CRAM."
"actions.info-bam.bam-commands.bam-unalign.title" = "Unalign to FASTQ"
"actions.info-bam.bam-commands.bam-unalign.tooltip" = "Extract raw reads from the selected BAM/CRAM into FASTQ files in the shared output directory."
"actions.info-bam.bam-commands.repair-ftdna-bam.title" = "Repair FTDNA BAM"
"actions.info-bam.bam-commands.repair-ftdna-bam.tooltip" = "Fix Family Tree DNA BAM formatting errors that can cause failures in standard tools like GATK."
