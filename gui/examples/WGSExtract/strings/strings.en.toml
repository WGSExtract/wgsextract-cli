"pages.extract.title" = "Extract"
"pages.extract.summary" = "Extract or transform data from the FASTQ, BAM or VCF files; such as mitochondrial DNA, Y chromosome or unmapped reads, random BAM subsets or custom regions, aligning FASTQ reads, re-aligning a BAM, or calling variants."
