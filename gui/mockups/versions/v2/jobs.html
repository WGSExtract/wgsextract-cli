<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobs · v2 · WGS Extract mockups</title>
<link rel="stylesheet" href="../../design-system/wgse.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<link rel="stylesheet" href="v2.css">
<script src="../../shared/boot.js" defer></script>
</head>
<body data-page-id="v2-jobs" data-shell="v2" data-nav="jobs" data-title="Jobs">
<div class="v2-page v2-page--narrow" data-annot-id="page">
  <header class="v2-head" data-annot-id="header">
    <div class="v2-head__text">
      <h1>Jobs</h1>
      <p class="v2-head__sub">One job runs at a time; the rest wait their turn. Jobs keep running when you close this window.</p>
    </div>
  </header>

  <section class="v2-section" data-annot-id="running">
    <h2>Running</h2>
    <div data-render="v2-jobs" data-section="running"></div>
  </section>

  <section class="v2-section" data-annot-id="queued">
    <h2>Queued</h2>
    <div data-render="v2-jobs" data-section="queued"></div>
  </section>

  <section class="v2-section" data-annot-id="needs-you">
    <h2>Needs you</h2>
    <div data-render="v2-jobs" data-section="needs-you"></div>
  </section>

  <section class="v2-section" data-annot-id="done">
    <h2>Done</h2>
    <div data-render="v2-jobs" data-section="done"></div>
  </section>

  <p class="v2-small v2-dim" data-annot-id="awake">This Mac stays awake while jobs run and tells you when one finishes or needs you. <a class="v2-link" href="settings.html">Change in Settings.</a></p>
</div>

</body>
</html>
