[project]
name = "wgsextract-gui-dev-tools"
version = "0.1.0"
description = "Python development tooling for WGS Extract GUI"
requires-python = ">=3.11"
# The OpenAPI generator uses the checkout's Python sources, not an installed
# CLI, and imports the same dependencies as the root Hatch build hook.
dependencies = ["platformdirs", "pyliftover", "tomli-w"]

[dependency-groups]
# GUI/CLI lock interoperability tests exercise the CLI's PID checks.
dev = ["psutil"]

[tool.uv]
package = false
