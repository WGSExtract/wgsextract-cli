"language.name" = "English"
"viewer.title" = "Genome viewer"
"viewer.viewReads" = "View reads"
"viewer.showInViewer" = "Show in viewer"
"viewer.libraryPath" = "File in My Genomes"
"viewer.libraryHelp" = "Enter the full path of an indexed BAM, CRAM or bgzip VCF/gVCF in the configured My Genomes library. The matching installed reference is selected from its header. Leave the position blank to open the first chromosome."
"viewer.openLibrary" = "Open library file"
"viewer.extraTracks" = "Optional panels and coverage"
"viewer.extraTracksHelp" = "Enter one full My Genomes file path per line, up to 16 tracks: BED, bedGraph or bigWig (.bw/.bigwig). Compressed BED/bedGraph must be BGZF (.gz) with a matching .tbi or .csi beside it. Chromosome names must match the loaded reference exactly. Reopen the library file to add or remove tracks."
"viewer.trackLimit" = "Too many supplemental tracks. Remove paths to keep at most 16 tracks, then reopen the library file."
"viewer.trackMissing" = "Supplemental file %{file} was not found. Check its full path and spelling in the optional tracks field."
"viewer.trackUnsupported" = "Unsupported supplemental file %{file}. Use BED (.bed), bedGraph (.bedgraph), or bigWig (.bw/.bigwig). BGZF BED/bedGraph (.gz) also needs an adjacent .tbi or .csi index."
"viewer.trackIndexMissing" = "Tabix index missing beside %{file}. BGZF BED/bedGraph needs a matching adjacent .tbi or .csi. Create it with tabix -p bed FILE.gz (add -C for CSI), then reopen the library file."
"viewer.trackCompression" = "Unsupported compression for %{file}. Use plain BED/bedGraph, or bgzip-compress it as .bed.gz/.bedgraph.gz and create an adjacent tabix BED-preset index. bigWig must not be gzip-compressed."
"viewer.trackContigs" = "Chromosome names or lengths in %{file} do not match the loaded reference. Use tracks from the same assembly with identical names (for example chr1 versus 1); correct the names and rebuild the index if needed."
"viewer.trackInvalid" = "Could not read %{file}. Check BED/bedGraph intervals and numeric values, or rebuild its tabix index with the BED preset (tabix -p bed; add -C for CSI). For bigWig, check that the file is valid and complete."
"viewer.trackTooLarge" = "%{file} is too large for an unindexed text track (32 MiB maximum). Use bgzip with an adjacent tabix index, or convert coverage to bigWig."
"viewer.automaticReference" = "Matched local reference: %{file}."
"viewer.libraryUnavailable" = "The library file could not be opened. Check the My Genomes and reference library folders in Settings, and that setup is complete. Only files within those configured libraries can be served. You can also select local files manually below."
"viewer.headerToolMissing" = "Reading this header needs the installed CLI runtime and samtools (BAM/CRAM) or bcftools (VCF). Complete setup and check these tools, then try again. Nothing is installed automatically."
"viewer.referenceUnverified" = "The exact CRAM reference could not be verified. Install its matching FASTA, indexes and sequence dictionary (.dict) in Reference Genomes. The viewer will not fetch a reference from the CRAM header."
"viewer.locusNotFound" = "Position not found in the selected reference. Check the chromosome name and that this reference matches your file."
"viewer.back" = "Back to WGS Extract"
"viewer.privacy" = "Local viewing stays on this computer. Remote viewing sends file paths and byte-range requests to your chosen server only after your consent. No public references or searches are used."
"viewer.remoteTitle" = "View files on a remote server"
"viewer.remoteHelp" = "Choose a config.toml containing the server URL and token in the desktop file dialog. The backend stores the token privately; the viewer never receives it. Other app operations still run locally."
"viewer.remoteImport" = "Choose remote server config.toml"
"viewer.remoteForget" = "Forget server and revoke access"
"viewer.remoteNotConfigured" = "No remote server configured. Remote viewing is off."
"viewer.remoteDestination" = "Destination: %{destination}"
"viewer.remotePlaintext" = "This URL uses unencrypted HTTP. Traffic observers can read the token, file paths and genomic bytes. Use an HTTPS proxy or a trusted encrypted tunnel."
"viewer.remotePath" = "Remote BAM, CRAM or bgzip VCF path"
"viewer.remoteIndex" = "Remote BAI, CRAI, TBI or CSI path"
"viewer.remoteReference" = "Matching remote FASTA path"
"viewer.remoteReferenceHelp" = "Choose the exact reference matching this sample. The server also reads the adjacent .fai and, for compressed FASTA, .gzi. All files must be inside its allowed roots."
"viewer.remoteConsent" = "Send these paths and byte ranges to the displayed server, and transfer selected genomic and reference bytes to this computer."
"viewer.remoteOpen" = "Connect and view remote file"
"viewer.remoteUnavailable" = "Remote viewing failed. Check the server URL, token, allowed roots and enabled viewer endpoint, then choose the configuration again."
"viewer.remoteConfigurationInvalid" = "Choose a regular config.toml containing a valid HTTP/HTTPS URL and the server token."
"viewer.reference" = "Local reference FASTA and index"
"viewer.referenceHelp" = "Select the installed FASTA and its .fai. BGZF FASTA (.fa.gz, .fasta.gz, .fna.gz) also needs its .gzi. CRAM needs the exact alignment reference. If missing, install it first in Reference Genomes."
"viewer.tracks" = "Reads, variants and their indexes"
"viewer.tracksHelp" = "Select BAM + BAI/CSI, CRAM + CRAI, or bgzip VCF/gVCF + TBI/CSI together. You can select several tracks. Files are read in indexed slices, not copied or uploaded."
"viewer.locus" = "Position (1-based, inclusive)"
"viewer.open" = "Open local files"
"viewer.go" = "Go"
"viewer.zoomIn" = "Zoom in"
"viewer.zoomOut" = "Zoom out"
"viewer.empty" = "Choose a reference, tracks and a position such as chr1:1000-2000."
"viewer.loading" = "Opening local files…"
"viewer.ready" = "Local tracks loaded. Drag to pan, zoom in to see individual bases, or click a read or variant for details."
"viewer.remoteReady" = "Remote tracks loaded. Drag to pan, zoom in to see individual bases, or click a read or variant for details."
"viewer.remoteReferenceSelected" = "Selected remote reference: %{file}."
"viewer.limits" = "Supports indexed BAM, CRAM and VCF/gVCF, plus optional BED, bedGraph and bigWig beside a local library file. Local library files use automatic reference matching and installed gene spans and cytobands. Remote and manually selected files require a matching reference. rsID search is not available. Context menus and external links are disabled. Leaving this page revokes file access."
"viewer.navigation" = "Position or RefSeq gene symbol"
"viewer.geneHelp" = "Enter a 1-based inclusive position or an exact RefSeq symbol (case-insensitive). Gene search uses only the installed gene-map for this reference; no public lookup. Spans cover genes, not exons or transcripts."
"viewer.geneTrack" = "RefSeq gene spans"
"viewer.cytobandMissing" = "Cytoband resource %{file} is not installed. Run `%{command}` to explicitly download it from UCSC, then reopen this file. Reads and coordinates still work; the viewer downloads nothing."
"viewer.cytobandInvalid" = "Cytoband resource %{file} is malformed, truncated or too large. Reinstall it with `%{command}`, then reopen this file. Reads and coordinates still work."
"viewer.cytobandMismatch" = "Cytoband resource %{file} does not match this reference's chromosome lengths. Check the reference build and install its cytobands with `%{command}`, then reopen this file."
"viewer.cytobandContigsSkipped" = "Some chromosomes in %{file} are absent or ambiguous in this reference and have no ideogram. Use a reference with unambiguous chromosome names; reads and coordinates still work."
"viewer.cytobandReferenceInvalid" = "Cytobands cannot use this reference index: invalid or duplicate chromosome lengths. Rebuild the FASTA .fai with samtools faidx and reopen this file."
"viewer.cytobandBuildUnsupported" = "Cytobands require one chromosome 1 with a recognized hg19/hg38 length. Open a matching installed human reference after installing cytobands_hg19.tsv with `wgsextract ref cytobands --build hg19 --download` or cytobands_hg38.tsv with `wgsextract ref cytobands --build hg38 --download`. Reads and coordinates still work."
"viewer.geneMapMissing" = "Gene-map %{file} is not installed. Run `wgsextract ref gene-map` to explicitly download the hg19/hg38 tables, then reopen this file. Coordinates still work."
"viewer.geneMapInvalid" = "Cannot read gene-map %{file}: malformed, duplicate, truncated or oversized data. Reinstall with `wgsextract ref gene-map`, then reopen this file. Coordinates still work."
"viewer.geneMapMismatch" = "Gene-map %{file} does not match this reference's contigs or coordinate bounds. Check the reference build and reinstall with `wgsextract ref gene-map`, then reopen this file."
"viewer.geneContigsSkipped" = "Some genes in %{file} have absent or ambiguous contig names and were omitted from the track and search. Use a reference containing those contigs, or navigate by coordinates."
"viewer.geneReferenceInvalid" = "Gene-map cannot use this reference index: invalid or duplicate contig lengths. Rebuild the FASTA .fai with samtools faidx and reopen this file."
"viewer.geneBuildUnsupported" = "Gene-map requires a reference with one chromosome 1 of a recognized hg19/hg38 length. This reference's build cannot be matched safely. Use a matching installed human reference; coordinates still work."
"viewer.geneNotFound" = "Gene symbol not found in the installed gene-map for this reference. Use an exact RefSeq symbol or coordinates."
"viewer.geneSearchUnavailable" = "Gene search is unavailable for this reference. Use coordinates, or open a matching hg19/hg38 library file after installing its tables with `wgsextract ref gene-map`."
"viewer.referenceMissing" = "Reference not installed or not selected. Install the matching reference in Reference Genomes, then select its FASTA and .fai here, plus .gzi for BGZF FASTA. Nothing will be downloaded automatically."
"viewer.referenceCompressedIndexMissing" = "Select the .gzi index alongside %{file} and its .fai. If missing, index the BGZF reference first, then select all three files."
"viewer.referenceIndexMissing" = "Select the .fai index alongside %{file}. Index the reference first if it is missing."
"viewer.tracksMissing" = "Select a BAM, CRAM or bgzip VCF/gVCF file together with its index."
"viewer.indexMissing" = "Index missing for %{file}. Select its matching BAI/CSI, CRAI or TBI/CSI too. Create an index first if it is missing."
"viewer.unsupportedFile" = "Unsupported track: %{file}. Choose BAM, CRAM or bgzip-compressed VCF/gVCF with its index."
"viewer.ambiguousFile" = "Select exactly one reference and avoid files with duplicate names. Open files from different folders separately."
"viewer.invalidLocus" = "Enter a position as chromosome:start-end, with 1-based inclusive coordinates (for example chr1:1000-2000). Gene and rsID search are not available."
"viewer.loadFailed" = "The viewer could not read these files or this position. Check that the files and indexes match, the chromosome exists and, for CRAM, the reference is exact. Reselect the files and try again."
