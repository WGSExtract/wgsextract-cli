"viewer.trackUnsupported" = "Fichier supplémentaire %{file} non pris en charge. Utilisez BED (.bed), bedGraph (.bedgraph) ou bigWig (.bw/.bigwig). BGZF BED/bedGraph (.gz) exige aussi un index .tbi ou .csi adjacent."  # i18n-source-hash:2278fc46
"viewer.trackIndexMissing" = "Index tabix absent à côté de %{file}. BGZF BED/bedGraph exige un .tbi ou .csi adjacent correspondant. Créez-le avec tabix -p bed FILE.gz (ajoutez -C pour CSI), puis rouvrez le fichier de bibliothèque."  # i18n-source-hash:659a4642
"viewer.trackCompression" = "Compression non prise en charge pour %{file}. Utilisez BED/bedGraph sans compression, ou bgzip au format .bed.gz/.bedgraph.gz avec un index tabix adjacent utilisant le préréglage BED. bigWig ne doit pas être compressé avec gzip."  # i18n-source-hash:06dd70b7
"viewer.trackContigs" = "Les noms ou longueurs de chromosomes de %{file} ne correspondent pas à la référence. Utilisez des pistes du même assemblage avec des noms identiques (par exemple chr1 ou 1) ; corrigez les noms et reconstruisez l’index si nécessaire."  # i18n-source-hash:c2936859
"viewer.trackInvalid" = "Impossible de lire %{file}. Vérifiez les intervalles BED/bedGraph et les valeurs numériques, ou reconstruisez l’index avec le préréglage BED (tabix -p bed ; ajoutez -C pour CSI). Pour bigWig, vérifiez que le fichier est valide et complet."  # i18n-source-hash:9dd0905b
"viewer.trackTooLarge" = "%{file} dépasse la limite des pistes texte sans index (32 MiB). Utilisez bgzip avec un index tabix adjacent ou convertissez la couverture en bigWig."  # i18n-source-hash:fa3f9349
