"viewer.extraTracks" = "Régions et couverture facultatives"  # i18n-source-hash:d1cf2aaa
"viewer.extraTracksHelp" = "Saisissez un chemin complet de Mes génomes par ligne, jusqu’à 16 pistes : BED, bedGraph ou bigWig (.bw/.bigwig). Les fichiers BED/bedGraph compressés exigent BGZF (.gz) et un index .tbi ou .csi adjacent. Les noms de chromosomes doivent correspondre exactement à la référence. Rouvrez le fichier de bibliothèque pour modifier les pistes."  # i18n-source-hash:ff59fad5
"viewer.trackLimit" = "Trop de pistes supplémentaires. Retirez des chemins pour conserver au maximum 16 pistes, puis rouvrez le fichier de bibliothèque."  # i18n-source-hash:19dd986f
