"viewer.viewReads" = "Reads ansehen"  # i18n-source-hash:ead939e2
"viewer.libraryPath" = "Datei in Meine Genome"  # i18n-source-hash:db695806
"viewer.libraryHelp" = "Geben Sie den vollständigen Pfad einer indizierten BAM-, CRAM- oder bgzip-VCF/gVCF-Datei in der konfigurierten Bibliothek Meine Genome ein. Die installierte Referenz wird anhand des Headers gewählt. Ohne Position wird das erste Chromosom geöffnet."  # i18n-source-hash:deae7d57
"viewer.openLibrary" = "Bibliotheksdatei öffnen"  # i18n-source-hash:a91e3d1e
"viewer.automaticReference" = "Passende lokale Referenz: %{file}."  # i18n-source-hash:6e650985
"viewer.libraryUnavailable" = "Die Bibliotheksdatei konnte nicht geöffnet werden. Prüfen Sie die Ordner für Meine Genome und Referenzen in den Einstellungen und schließen Sie die Einrichtung ab. Nur Dateien in diesen Bibliotheken können bereitgestellt werden. Alternativ wählen Sie unten lokale Dateien manuell aus."  # i18n-source-hash:1e0208d7
"viewer.headerToolMissing" = "Zum Lesen dieses Headers werden die installierte CLI-Laufzeit und samtools (BAM/CRAM) oder bcftools (VCF) benötigt. Schließen Sie die Einrichtung ab und prüfen Sie diese Werkzeuge. Es wird nichts automatisch installiert."  # i18n-source-hash:80d34d07
"viewer.referenceUnverified" = "Die genaue CRAM-Referenz konnte nicht verifiziert werden. Installieren Sie die passende FASTA mit Indizes und Sequenzwörterbuch (.dict) unter Referenzgenome. Der Betrachter lädt keine Referenz aus dem CRAM-Header herunter."  # i18n-source-hash:344f1e75
"viewer.locusNotFound" = "Position in der gewählten Referenz nicht gefunden. Prüfen Sie den Chromosomennamen und ob die Referenz zu Ihrer Datei passt."  # i18n-source-hash:9a2b55ff
"viewer.back" = "Zurück zu WGS Extract"  # i18n-source-hash:78623ef3
"viewer.privacy" = "Reads und Varianten auf diesem Computer prüfen. Es wird nichts hochgeladen; Online-Referenzen und Online-Suchen werden nicht verwendet."  # i18n-source-hash:350a8494
"viewer.reference" = "Lokale Referenz-FASTA und Index"  # i18n-source-hash:2844ca6e
"viewer.referenceHelp" = "Wählen Sie die installierte FASTA und ihre .fai. BGZF-FASTA (.fa.gz, .fasta.gz, .fna.gz) benötigt auch ihre .gzi. CRAM benötigt die genaue Alignment-Referenz. Falls sie fehlt, installieren Sie sie unter Referenzgenome."  # i18n-source-hash:0eea9b08
"viewer.tracks" = "Reads, Varianten und ihre Indizes"  # i18n-source-hash:c369f330
"viewer.tracksHelp" = "Wählen Sie BAM + BAI/CSI, CRAM + CRAI oder bgzip-VCF/gVCF + TBI/CSI gemeinsam aus. Mehrere Spuren sind möglich. Dateien werden abschnittsweise über den Index gelesen, nicht kopiert oder hochgeladen."  # i18n-source-hash:67de1573
"viewer.locus" = "Position (1-basiert, einschließlich)"  # i18n-source-hash:a84836d0
"viewer.open" = "Lokale Dateien öffnen"  # i18n-source-hash:71b77366
"viewer.go" = "Los"  # i18n-source-hash:2e0b45f2
"viewer.zoomIn" = "Vergrößern"  # i18n-source-hash:4fc05f27
"viewer.zoomOut" = "Verkleinern"  # i18n-source-hash:a4ae4b24
"viewer.empty" = "Wählen Sie eine Referenz, Spuren und eine Position wie chr1:1000-2000."  # i18n-source-hash:e1c28ce6
"viewer.loading" = "Lokale Dateien werden geöffnet…"  # i18n-source-hash:2adfe53f
"viewer.ready" = "Lokale Spuren geladen. Ziehen zum Verschieben, vergrößern für einzelne Basen oder auf einen Read bzw. eine Variante klicken für Details."  # i18n-source-hash:f136d021
"viewer.limits" = "Unterstützt indizierte BAM-, CRAM- und VCF/gVCF-Dateien sowie optionale BED-, bedGraph- und bigWig-Spuren neben einer Bibliotheksdatei. Bibliotheksdateien nutzen automatische Referenzzuordnung und installierte hg19/hg38-RefSeq-Genspannen; manuell gewählte Reads/Varianten benötigen eine Referenzauswahl. Zytobänder, rsID-Suche und Fernzugriff sind noch nicht verfügbar. Kontextmenüs und externe Links sind deaktiviert. Beim Verlassen werden die Dateien geschlossen."  # i18n-source-hash:5b4af839
"viewer.navigation" = "Position oder RefSeq-Gensymbol"  # i18n-source-hash:3020fced
"viewer.geneHelp" = "Eine 1-basierte inklusive Position oder ein exaktes RefSeq-Symbol eingeben (ohne Beachtung der Großschreibung). Die Suche nutzt nur die installierte Genkarte dieser Referenz, keine öffentliche Suche. Spannen zeigen Gene, nicht Exons oder Transkripte."  # i18n-source-hash:0d77cfd4
"viewer.geneTrack" = "RefSeq-Genspannen"  # i18n-source-hash:d2c94706
"viewer.geneMapMissing" = "Genkarte %{file} ist nicht installiert. Mit `wgsextract ref gene-map` die hg19/hg38-Tabellen ausdrücklich herunterladen und die Datei erneut öffnen. Koordinaten funktionieren weiterhin."  # i18n-source-hash:22568f35
"viewer.geneMapInvalid" = "Genkarte %{file} ist fehlerhaft, doppelt, abgeschnitten oder zu groß. Mit `wgsextract ref gene-map` neu installieren und die Datei erneut öffnen. Koordinaten funktionieren weiterhin."  # i18n-source-hash:db990d60
"viewer.geneMapMismatch" = "Genkarte %{file} passt nicht zu den Contigs oder Koordinatengrenzen dieser Referenz. Referenzbuild prüfen, mit `wgsextract ref gene-map` neu installieren und die Datei erneut öffnen."  # i18n-source-hash:0a8035e2
"viewer.geneContigsSkipped" = "Einige Gene in %{file} haben fehlende oder mehrdeutige Contignamen und wurden aus Spur und Suche entfernt. Eine Referenz mit diesen Contigs nutzen oder mit Koordinaten navigieren."  # i18n-source-hash:d459277e
"viewer.geneReferenceInvalid" = "Die Genkarte kann diesen Referenzindex nicht nutzen: ungültige oder doppelte Contiglängen. FASTA-.fai mit samtools faidx neu erstellen und die Datei erneut öffnen."  # i18n-source-hash:3ce06e08
"viewer.geneBuildUnsupported" = "Die Genkarte benötigt genau ein Chromosom 1 mit erkannter hg19/hg38-Länge. Der Build dieser Referenz kann nicht sicher zugeordnet werden. Eine passende installierte menschliche Referenz nutzen; Koordinaten funktionieren weiterhin."  # i18n-source-hash:c105c248
"viewer.geneNotFound" = "Gensymbol nicht in der installierten Genkarte dieser Referenz gefunden. Ein exaktes RefSeq-Symbol oder Koordinaten nutzen."  # i18n-source-hash:88de453b
"viewer.geneSearchUnavailable" = "Gensuche ist für diese Referenz nicht verfügbar. Koordinaten nutzen oder eine passende hg19/hg38-Bibliotheksdatei öffnen, nachdem die Tabellen mit `wgsextract ref gene-map` installiert wurden."  # i18n-source-hash:7a7b5ed6
"viewer.referenceMissing" = "Referenz nicht installiert oder nicht ausgewählt. Installieren Sie die passende Referenz unter Referenzgenome und wählen Sie hier FASTA und .fai sowie .gzi für BGZF-FASTA. Es wird nichts automatisch heruntergeladen."  # i18n-source-hash:094f8319
"viewer.referenceCompressedIndexMissing" = "Wählen Sie den .gzi-Index zusammen mit %{file} und seiner .fai. Falls er fehlt, indexieren Sie zuerst die BGZF-Referenz und wählen Sie dann alle drei Dateien."  # i18n-source-hash:cbb9b192
"viewer.referenceIndexMissing" = "Wählen Sie den .fai-Index zusammen mit %{file}. Erstellen Sie bei Bedarf zuerst den Referenzindex."  # i18n-source-hash:a39bb059
"viewer.tracksMissing" = "Wählen Sie eine BAM-, CRAM- oder bgzip-VCF/gVCF-Datei zusammen mit ihrem Index."  # i18n-source-hash:2e568b39
"viewer.indexMissing" = "Index für %{file} fehlt. Wählen Sie auch die passende BAI/CSI-, CRAI- oder TBI/CSI-Datei. Erstellen Sie bei Bedarf zuerst einen Index."  # i18n-source-hash:f6375924
"viewer.unsupportedFile" = "Nicht unterstützte Spur: %{file}. Wählen Sie BAM, CRAM oder bgzip-komprimierte VCF/gVCF mit Index."  # i18n-source-hash:bf88f0f7
"viewer.ambiguousFile" = "Wählen Sie genau eine Referenz und vermeiden Sie doppelte Dateinamen. Öffnen Sie Dateien aus verschiedenen Ordnern getrennt."  # i18n-source-hash:9fe8a378
"viewer.invalidLocus" = "Geben Sie eine Position als Chromosom:Start-Ende mit 1-basierten einschließlich geltenden Koordinaten ein (z. B. chr1:1000-2000). Gen- und rsID-Suche sind nicht verfügbar."  # i18n-source-hash:391ccefc
"viewer.loadFailed" = "Die Dateien oder die Position konnten nicht gelesen werden. Prüfen Sie passende Dateien und Indizes, den Chromosomennamen und bei CRAM die genaue Referenz. Wählen Sie die Dateien erneut und versuchen Sie es noch einmal."  # i18n-source-hash:4b41befc
