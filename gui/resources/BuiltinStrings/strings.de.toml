"viewer.trackCompression" = "Nicht unterstützte Komprimierung für %{file}. Unkomprimiertes BED/bedGraph verwenden oder mit bgzip als .bed.gz/.bedgraph.gz komprimieren und einen Tabix-Index mit BED-Voreinstellung daneben erstellen. bigWig darf nicht gzip-komprimiert sein."  # i18n-source-hash:06dd70b7
