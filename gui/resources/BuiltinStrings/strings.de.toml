"viewer.cytobandContigsSkipped" = "Einige Chromosomen in %{file} fehlen oder sind in dieser Referenz mehrdeutig und haben kein Ideogramm. Eine Referenz mit eindeutigen Chromosomennamen nutzen; Reads und Koordinaten funktionieren weiterhin."  # i18n-source-hash:080a2f20
"viewer.cytobandInvalid" = "Die Zytoband-Ressource %{file} ist fehlerhaft, abgeschnitten oder zu groß. Installieren Sie sie über die Seite Referenzdaten neu und öffnen Sie diese Datei erneut. Reads und Koordinaten funktionieren weiterhin."  # i18n-source-hash:04d7f1f2
"viewer.cytobandMismatch" = "Die Zytoband-Ressource %{file} passt nicht zu den Chromosomenlängen dieser Referenz. Prüfen Sie den Referenzbuild, laden Sie passende Zytobänder auf der Seite Referenzdaten herunter und öffnen Sie diese Datei erneut."  # i18n-source-hash:252b24ae
"viewer.cytobandMissing" = "Die Zytoband-Ressource %{file} ist nicht installiert. Öffnen Sie die Seite Referenzdaten, um sie herunterzuladen, und öffnen Sie diese Datei erneut. Reads und Koordinaten funktionieren weiterhin; der Viewer lädt nichts herunter."  # i18n-source-hash:b0c42608
"viewer.cytobandReferenceInvalid" = "Zytobänder können diesen Referenzindex nicht nutzen: ungültige oder doppelte Chromosomenlängen. FASTA-.fai mit samtools faidx neu erstellen und die Datei erneut öffnen."  # i18n-source-hash:5f428a9a
