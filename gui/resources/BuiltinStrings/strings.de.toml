"viewer.trackUnsupported" = "Nicht unterstützte Zusatzdatei %{file}. BED (.bed), bedGraph (.bedgraph) oder bigWig (.bw/.bigwig) verwenden. BGZF BED/bedGraph (.gz) benötigt außerdem einen benachbarten .tbi- oder .csi-Index."  # i18n-source-hash:2278fc46
