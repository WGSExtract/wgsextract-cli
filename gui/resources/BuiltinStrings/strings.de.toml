"viewer.navigationHelpCoordsOnly" = "Eine 1-basierte inklusive Position eingeben (z. B. chr1:1000-2000)."  # i18n-source-hash:d66a0d43
"viewer.navigationHelpWithRsid" = "Eine 1-basierte inklusive Position (chr1:1000-2000), ein exaktes RefSeq-Gensymbol (APOE) oder eine häufige rsID (rs429358) eingeben. Es sind nur die häufigsten menschlichen rsIDs (~37 Mio. aus dbSNP) lokal geladen und verfügbar; Suchen nutzen nur installierte lokale Referenzdatenbanken ohne öffentliche Suche."  # i18n-source-hash:5bbbf053
"viewer.navigationHelpWithRsidOnly" = "Eine 1-basierte inklusive Position (chr1:1000-2000) oder eine häufige rsID (rs429358) eingeben. Es sind nur die häufigsten menschlichen rsIDs (~37 Mio. aus dbSNP) lokal geladen und verfügbar; keine öffentliche Suche."  # i18n-source-hash:4332d96d
