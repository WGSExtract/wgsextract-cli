"viewer.extraTracks" = "Optionale Regionen und Abdeckung"  # i18n-source-hash:d1cf2aaa
"viewer.extraTracksHelp" = "Pro Zeile einen vollständigen lokalen Dateipfad eingeben, höchstens 16 Spuren: BED, bedGraph oder bigWig (.bw/.bigwig). Komprimierte BED/bedGraph-Dateien benötigen BGZF (.gz) und eine passende .tbi oder .csi daneben. Chromosomennamen müssen exakt zur Referenz passen. Zum Ändern der Spuren die Datei erneut öffnen."  # i18n-source-hash:ad8a5512
"viewer.geneBuildUnsupported" = "Die Genkarte benötigt genau ein Chromosom 1 mit erkannter GRCh37/GRCh38-Länge. Der Build dieser Referenz kann nicht sicher zugeordnet werden. Eine passende installierte menschliche Referenz nutzen; Koordinaten funktionieren weiterhin."  # i18n-source-hash:850474cf
"viewer.geneContigsSkipped" = "Einige Gene in %{file} haben fehlende oder mehrdeutige Contignamen und wurden aus Spur und Suche entfernt. Eine Referenz mit diesen Contigs nutzen oder mit Koordinaten navigieren."  # i18n-source-hash:d459277e
"viewer.geneHelp" = "Eine 1-basierte inklusive Position oder ein exaktes RefSeq-Symbol eingeben (ohne Beachtung der Großschreibung). Die Suche nutzt nur die installierte Genkarte dieser Referenz, keine öffentliche Suche. Spannen zeigen ganze Gene; Exons und Transkripte stehen in der Spur RefSeq-Transkripte, sobald die Genkarte über die Seite Referenzdaten installiert wurde."  # i18n-source-hash:5b08a883
"viewer.geneMapInvalid" = "Genkarte %{file} ist fehlerhaft, doppelt, abgeschnitten oder zu groß. Installieren Sie die Genkarte über die Seite Referenzdaten neu und öffnen Sie diese Datei erneut. Koordinaten funktionieren weiterhin."  # i18n-source-hash:16b0acc0
"viewer.geneMapMismatch" = "Genkarte %{file} passt nicht zu den Contigs oder Koordinatengrenzen dieser Referenz. Prüfen Sie den Referenzbuild, installieren Sie die Genkarte über die Seite Referenzdaten neu und öffnen Sie diese Datei erneut."  # i18n-source-hash:e9dd8969
"viewer.geneMapMissing" = "Genkarte %{file} ist nicht installiert. Öffnen Sie die Seite Referenzdaten, um die Genkarte herunterzuladen, und öffnen Sie diese Datei erneut. Koordinaten funktionieren weiterhin."  # i18n-source-hash:c47eabfe
"viewer.geneNotFound" = "Gensymbol nicht in der installierten Genkarte dieser Referenz gefunden. Ein exaktes RefSeq-Symbol oder Koordinaten nutzen."  # i18n-source-hash:88de453b
"viewer.geneReferenceInvalid" = "Die Genkarte kann diesen Referenzindex nicht nutzen: ungültige oder doppelte Contiglängen. FASTA-.fai mit samtools faidx neu erstellen und die Datei erneut öffnen."  # i18n-source-hash:3ce06e08
"viewer.geneSearchUnavailable" = "Gensuche ist für diese Referenz nicht verfügbar. Koordinaten nutzen oder eine passende GRCh37/GRCh38-Bibliotheksdatei öffnen, nachdem die Genkarte auf der Seite Referenzdaten heruntergeladen wurde."  # i18n-source-hash:42ecd686
"viewer.geneTrack" = "RefSeq-Genspannen"  # i18n-source-hash:d2c94706
"viewer.go" = "Los"  # i18n-source-hash:2e0b45f2
"viewer.headerToolMissing" = "Zum Lesen dieses Headers werden die installierte CLI-Laufzeit und samtools (BAM/CRAM) oder bcftools (VCF) benötigt. Schließen Sie die Einrichtung ab und prüfen Sie diese Werkzeuge. Es wird nichts automatisch installiert."  # i18n-source-hash:80d34d07
"viewer.indexMissing" = "Index für %{file} fehlt. Wählen Sie auch die passende BAI/CSI-, CRAI- oder TBI/CSI-Datei. Erstellen Sie bei Bedarf zuerst einen Index."  # i18n-source-hash:f6375924
"viewer.invalidLocus" = "Geben Sie eine Position als Chromosom:Start-Ende mit 1-basierten einschließlich geltenden Koordinaten ein (z. B. chr1:1000-2000). Gen- und rsID-Suche sind nicht verfügbar."  # i18n-source-hash:391ccefc
"viewer.libraryHelp" = "Geben Sie den vollständigen Pfad einer indizierten BAM-, CRAM- oder bgzip-VCF/gVCF-Datei auf diesem Computer ein. Die installierte Referenz wird anhand des Headers gewählt. Ohne Position wird eine kartierte 100-bp-Region auf dem ersten Chromosom geöffnet."  # i18n-source-hash:fc72741c
"viewer.libraryPath" = "Lokaler Dateipfad"  # i18n-source-hash:ee9c8b77
"viewer.libraryUnavailable" = "Die Datei konnte nicht geöffnet werden. Prüfen Sie, ob die Datei vorhanden ist, der Referenzordner in den Einstellungen konfiguriert ist und die Einrichtung abgeschlossen ist. Alternativ wählen Sie unten lokale Dateien manuell aus."  # i18n-source-hash:6990ae77
"viewer.limits" = "Unterstützt indizierte BAM-, CRAM- und VCF/gVCF-Dateien sowie optionale BED-, bedGraph- und bigWig-Spuren neben einer lokalen Bibliotheksdatei. Lokale Bibliotheksdateien nutzen automatische Referenzzuordnung, installierte Genspannen, Transkripte, Zytobänder und Offline-dbSNP-rsID-Suche. Entfernte und manuell gewählte Dateien benötigen eine passende Referenz. Kontextmenüs und externe Links sind deaktiviert. Beim Verlassen wird der Dateizugriff widerrufen."  # i18n-source-hash:338328f2
"viewer.loadFailed" = "Die Dateien oder die Position konnten nicht gelesen werden. Prüfen Sie passende Dateien und Indizes, den Chromosomennamen und bei CRAM die genaue Referenz. Wählen Sie die Dateien erneut und versuchen Sie es noch einmal."  # i18n-source-hash:4b41befc
"viewer.loading" = "Lokale Dateien werden geöffnet…"  # i18n-source-hash:2adfe53f
"viewer.locus" = "Position (1-basiert, einschließlich)"  # i18n-source-hash:a84836d0
"viewer.locusNotFound" = "Position in der gewählten Referenz nicht gefunden. Prüfen Sie den Chromosomennamen und ob die Referenz zu Ihrer Datei passt."  # i18n-source-hash:9a2b55ff
"viewer.mitoNotRcrs" = "Diese mtDNA-Positionen sind auf der rCRS-Sequenz nummeriert, aber die Referenz dieser Probe hat eine andere chrM (etwa die Yoruba-chrM von hg19 oder die CHM13-chrM von T2T), daher würden sie auf falsche Basen zeigen. Verwenden Sie zum Anzeigen eine Referenz mit rCRS-chrM."  # i18n-source-hash:90a016bc
