"viewer.extraTracks" = "Optionale Regionen und Abdeckung"  # i18n-source-hash:d1cf2aaa
"viewer.extraTracksHelp" = "Pro Zeile einen vollständigen Dateipfad aus Meine Genome eingeben, höchstens 16 Spuren: BED, bedGraph oder bigWig (.bw/.bigwig). Komprimierte BED/bedGraph-Dateien benötigen BGZF (.gz) und eine passende .tbi oder .csi daneben. Chromosomennamen müssen exakt zur Referenz passen. Zum Ändern der Spuren die Bibliotheksdatei erneut öffnen."  # i18n-source-hash:ff59fad5
"viewer.trackLimit" = "Zu viele zusätzliche Spuren. Pfade entfernen, sodass höchstens 16 Spuren bleiben, und die Bibliotheksdatei erneut öffnen."  # i18n-source-hash:19dd986f
"viewer.trackMissing" = "Zusatzdatei %{file} wurde nicht gefunden. Vollständigen Pfad und Schreibweise im Feld für optionale Spuren prüfen."  # i18n-source-hash:7371ae1f
"viewer.trackUnsupported" = "Nicht unterstützte Zusatzdatei %{file}. BED (.bed), bedGraph (.bedgraph) oder bigWig (.bw/.bigwig) verwenden. BGZF BED/bedGraph (.gz) benötigt außerdem einen benachbarten .tbi- oder .csi-Index."  # i18n-source-hash:2278fc46
"viewer.trackIndexMissing" = "Tabix-Index neben %{file} fehlt. BGZF BED/bedGraph benötigt eine passende benachbarte .tbi oder .csi. Mit tabix -p bed FILE.gz erstellen (für CSI -C hinzufügen), dann die Bibliotheksdatei erneut öffnen."  # i18n-source-hash:659a4642
"viewer.trackCompression" = "Nicht unterstützte Komprimierung für %{file}. Unkomprimiertes BED/bedGraph verwenden oder mit bgzip als .bed.gz/.bedgraph.gz komprimieren und einen Tabix-Index mit BED-Voreinstellung daneben erstellen. bigWig darf nicht gzip-komprimiert sein."  # i18n-source-hash:06dd70b7
"viewer.trackContigs" = "Chromosomennamen oder -längen in %{file} passen nicht zur geladenen Referenz. Spuren derselben Genomversion mit identischen Namen verwenden (z. B. chr1 statt 1); Namen korrigieren und bei Bedarf den Index neu erstellen."  # i18n-source-hash:c2936859
"viewer.trackInvalid" = "%{file} konnte nicht gelesen werden. BED/bedGraph-Intervalle und Zahlenwerte prüfen oder den Tabix-Index mit BED-Voreinstellung neu erstellen (tabix -p bed; für CSI zusätzlich -C). Bei bigWig prüfen, ob die Datei gültig und vollständig ist."  # i18n-source-hash:9dd0905b
"viewer.trackTooLarge" = "%{file} ist für eine Textspur ohne Index zu groß (maximal 32 MiB). bgzip mit einem Tabix-Index daneben verwenden oder Abdeckung in bigWig umwandeln."  # i18n-source-hash:fa3f9349
