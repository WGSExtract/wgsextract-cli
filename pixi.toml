[workspace]
name = "wgsextract-cli"
version = "0.8.6"
description = "A modern, standalone Command-Line Interface for WGS Extract."
authors = ["WGS Extract Contributors"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.13.*"

[target.unix.dependencies]
curl = ">=8.21,<9"
gzip = ">=1.14,<2"
tar = ">=1.35,<2"

[target.win-64.dependencies]
curl = ">=8.21,<9"

# Python's UTF-8 mode (the default from Python 3.15): files and pipes default
# to UTF-8, not the Windows ANSI code page, as on macOS and Linux.
[target.win-64.activation.env]
PYTHONUTF8 = "1"

# GATK4's Bioconda package requires Python 3.10, so it gets its own environment;
# the CLI runs `gatk` through it automatically. GATK 4.6 is built for Java 17.
[feature.gatk.dependencies]
python = "3.10.*"
openjdk = "17.*"
gatk4 = ">=4.6.2.0,<5"

[feature.gatk.target.win-64.dependencies]
# The sidecar implements GKL 0.8.11's JNI ABI bundled with this GATK version.
gatk4 = "==4.6.2.0"
# gatk-windows-tools-begin
gkl = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/gkl-0.8.11-wgse_1.conda", sha256 = "b8849e9de930702f3caf8c473c4ed3f3c9b179b92a082100f76ba24ee8d3084d" }
# gatk-windows-tools-end

# PharmCAT's pipeline is a release download the user extracts (see
# `vcf pharmcat`); it needs Python with these packages, Java 17 and
# bcftools/bgzip 1.18. On Windows, bcftools and htslib are the Windows Tools
# builds the default environment uses (pin.py keeps both blocks in step).
[feature.pharmcat]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[feature.pharmcat.dependencies]
python = "3.12.*"
pandas = ">=2.3.3"
colorama = ">=0.4.6"
packaging = ">=24.1"
openjdk = "17.*"

[feature.pharmcat.target.unix.dependencies]
bcftools = ">=1.18"
htslib = ">=1.18"

[feature.pharmcat.target.win-64.dependencies]
# pharmcat-windows-tools-begin
bcftools = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/bcftools-1.24-wgse_3.conda", sha256 = "c6c2d65cb85851a7518cc607c86994a5a8679a57c6bc3d288104e43edd7db476" }
htslib = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/htslib-1.24-wgse_2.conda", sha256 = "b50f7db30db61457651e0290b49b021d6a0f5031c7f3016a7086ff7a6ecf4812" }
# pharmcat-windows-tools-end

[feature.bio-tools.target.unix.dependencies]
samtools = ">=1.24,<2"
bcftools = ">=1.24,<2"
htslib = ">=1.24,<2"
bwa = ">=0.7.19,<0.8"
# bwa-mem2 aligns short reads in about 3/4 of bwa's time, with the same output.
bwa-mem2 = ">=2.3,<3"
minimap2 = ">=2.31,<3"
fastp = ">=1.1,<2"
fastqc = ">=0.13,<0.14"
# Haplogrep 3 classifies mtDNA haplogroups; haplocheck (with its bundled
# mutserve) checks mtDNA for contamination. Both are noarch Java jars that the
# CLI runs directly. Haplogrep 3.3 is not on Bioconda yet.
haplogrep3 = "==3.2.2"
haplocheck = "==1.3.3"
delly = ">=2.7,<3"
samblaster = ">=0.1.26,<0.2"
# Reads GERP bigWig scores for `vcf gerp`; Bioconda builds Linux and macOS.
pybigwig = ">=0.3.24,<0.4"

[feature.bio-tools.target.linux-64.dependencies]
wget = ">=1.25,<2"
# Only Linux uses sambamba (macOS sorts with samtools); its osx-arm64 build
# segfaults even on --version.
sambamba = ">=1.0.1,<2"

[feature.bio-tools.target.linux-aarch64.dependencies]
# Match the qualified x64 calling version; do not introduce architecture drift.
bcftools = "==1.24"

[feature.bio-tools.target.win-64.dependencies]
fastqc = ">=0.13,<0.14"
haplogrep3 = "==3.2.2"
haplocheck = "==1.3.3"
# Bioconda has no Windows builds: these are WGS Extract's own static MinGW-w64
# builds (packaging/windows), from Windows Tools releases. For complete sets use
# `python packaging/windows/pin.py <tag>`, then `pixi lock`. For partial releases,
# update only the selected URL/SHA-256 entries by hand; never use pin.py.
# windows-tools-begin
bcftools = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/bcftools-1.24-wgse_3.conda", sha256 = "c6c2d65cb85851a7518cc607c86994a5a8679a57c6bc3d288104e43edd7db476" }
bwa = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/bwa-0.7.19-wgse_2.conda", sha256 = "57948195595bb267e46388964acc6402b13f79a2daacea482eb0e38780a38d0a" }
bwa-mem2 = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/bwa-mem2-2.3-wgse_2.conda", sha256 = "6af688b38b1ef3eb1d15dbc72485292734cce8f630972c2cd19cfda3231501b8" }
fastp = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/fastp-1.4.0-wgse_1.conda", sha256 = "c219c35b71aa091e981765f47cf29db0a3b8e91721363bb87e62c27b6abe0b57" }
htslib = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/htslib-1.24-wgse_2.conda", sha256 = "b50f7db30db61457651e0290b49b021d6a0f5031c7f3016a7086ff7a6ecf4812" }
minimap2 = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/minimap2-2.31-wgse_1.conda", sha256 = "099ae6b6ac4c2d16d540b25e2e1e0e9a4365b30a34ad646ea954c1949870436b" }
samblaster = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/samblaster-0.1.26-wgse_1.conda", sha256 = "4e844c9a8cc682de207b0de0dd37da7ae8bb4c17fe493feba8969a4898f8e94b" }
samtools = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/windows-tools-8/samtools-1.24-wgse_3.conda", sha256 = "89098a71873e1df35d7468b46a67e5a26a891617d627d695461c96839969d9a1" }
# windows-tools-end

# FreeBayes' only osx-arm64 build pins htslib 1.21, which conflicts with the
# htslib 1.24 that Delly 2 needs, so it gets its own environment; the CLI runs
# it there automatically. Fold it back into bio-tools once that is rebuilt.
[feature.freebayes.target.unix.dependencies]
freebayes = ">=1.3.10,<2"

# Bioconda's bwa-mem3 writes bwa's or bwa-mem2's exact records (--compat)
# several times faster (#672). Its builds need htslib 1.25, which conflicts with
# the qualified samtools/bcftools 1.24, so it gets its own environment (#591);
# the CLI runs it there automatically. 0.16 is the release checked for parity.
[feature.bwa-mem3]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.bwa-mem3.dependencies]
bwa-mem3 = "0.16.*"

# HLA typing with T1K (`typing hla`) and repeat expansions with ExpansionHunter
# (`typing str`). T1K's package pins samtools 0.1 and ExpansionHunter's (on macOS)
# htslib 1.22, so each gets its own environment; the CLI runs them there.
[feature.t1k.target.unix.dependencies]
t1k = ">=1.0.10,<2"

[feature.expansionhunter.target.unix.dependencies]
expansionhunter = ">=5.0.0,<6"

# Long-read repeat sizing (`typing str` on Nanopore and PacBio reads): LongTR
# by default, STRkit with --caller strkit. Opt-in environments the CLI runs
# automatically; Bioconda builds LongTR for Linux and macOS, and STRkit is
# pure Python from PyPI with a Rust extension built for Linux and macOS.
[feature.longtr]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.longtr.dependencies]
longtr = ">=1.2,<2"

[feature.strkit]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.strkit.dependencies]
python = "3.13.*"
# Prebuilt, so PyPI's parasail sdist isn't compiled on ARM.
parasail-python = ">=1.3.4,<1.4"

[feature.strkit.pypi-dependencies]
strkit = "==0.25.0"

[feature.pacbio.dependencies]
python = "3.13.*"

[feature.pacbio.pypi-dependencies]
wgsextract-cli = { path = ".", editable = true }

[feature.pacbio.target.linux-64.dependencies]
pbmm2 = ">=26.2.99,<27"
pbsv = ">=2.11,<3"
sniffles = ">=2.8.1,<3"

[feature.pacbio.target.osx-arm64.dependencies]
sniffles = ">=2.8.1,<3"

[feature.pacbio.target.osx-64.dependencies]
# No current pbmm2 for Intel macOS (1.7.0 needs zlib <1.3); use minimap2 map-hifi.
sniffles = ">=2.8.1,<3"

# Clair3 calls Nanopore small variants (`vcf clair3`). It pins Python 3.11 and
# PyTorch, so it gets its own opt-in environment (`pixi install -e clair3`) that
# the CLI runs automatically. Bioconda builds 2.0.5+ for Linux (x86-64, ARM64)
# and Apple Silicon macOS; Linux builds use CPU-only PyTorch.
[feature.clair3]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.clair3.dependencies]
clair3 = ">=2.0.5,<3"

# modkit summarizes Nanopore/PacBio base-modification (MM/ML) tags into
# bedMethyl (`methylation pileup`). Opt-in environment (`pixi install -e modkit`);
# Bioconda builds it for Linux and macOS, not Windows.
[feature.modkit]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.modkit.dependencies]
ont-modkit = ">=0.6.4,<0.7"

# somalier sketches a BAM/CRAM/VCF at known common sites for sex, relatedness
# and continental ancestry (`qc relate`). Opt-in environment
# (`pixi install -e somalier`); Bioconda builds it for Linux and macOS only.
[feature.somalier]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.somalier.dependencies]
somalier = ">=0.3.7,<0.4"

# VerifyBamID2 estimates nuclear-DNA contamination (FREEMIX) from a GRCh37/38
# BAM/CRAM (`qc contamination`) with the 1000 Genomes SVD resources its package
# ships. Opt-in environment (`pixi install -e verifybamid2`) that the CLI runs
# automatically; Bioconda builds it for Linux and macOS, not Windows. Its
# osx-arm64 build pins htslib <1.24, so it can't join the default solve group.
[feature.verifybamid2.target.unix.dependencies]
verifybamid2 = "==2.0.3"

# Read-backed phasing of long-read calls (`vcf phase`): WhatsHap, and the
# faster LongPhase where Bioconda builds it (not Intel macOS or Windows).
# Opt-in environment (`pixi install -e phasing`) that the CLI runs automatically.
[feature.phasing]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.phasing.dependencies]
whatshap = ">=2.8,<3"

[feature.phasing.target.linux-64.dependencies]
longphase = ">=2.1.1,<3"

[feature.phasing.target.linux-aarch64.dependencies]
longphase = ">=2.1.1,<3"

[feature.phasing.target.osx-arm64.dependencies]
longphase = ">=2.1.1,<3"

[feature.vep]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.vep.target.unix.dependencies]
ensembl-vep = ">=116.3,<117"

# conda-forge's osx-arm64 libdb ships x86_64 dylibs (conda-forge/libdb-feedstock#17),
# so DB_File's db_create is unresolved and loading it segfaults. Binding symbols
# at load time makes DB_File fail cleanly instead, and BioPerl's AnyDBM_File
# falls back to NDBM_File; VEP reads FASTA through Bio::DB::HTS::Faidx anyway.
[feature.vep.target.osx-arm64.activation.env]
PERL_DL_NONLAZY = "1"

# vep-rs, a Rust reimplementation of Ensembl VEP (`vep run --engine vep-rs`),
# on every platform including native Windows. No conda package exists upstream:
# these are WGS Extract's builds from packaging/vep-rs (workflow vep_rs.yml),
# published as a vep-rs-N release and pinned here by URL and SHA-256.
[feature.vep-rs]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.vep-rs.target.linux-64.dependencies]
vep-rs = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/vep-rs-1/vep-rs-0.5.0-linux64_wgse_1.conda", sha256 = "ef106d4f34ff5402bd5bdb3ed8c154dfa95e23cddbba60996f8f77d4ad6565c9" }

[feature.vep-rs.target.linux-aarch64.dependencies]
vep-rs = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/vep-rs-1/vep-rs-0.5.0-linuxaarch64_wgse_1.conda", sha256 = "4bf2a8393e9f1041bbe8db1109df44dca0cbf3f17fab342509182ea2efabc18d" }

[feature.vep-rs.target.osx-64.dependencies]
vep-rs = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/vep-rs-1/vep-rs-0.5.0-osx64_wgse_1.conda", sha256 = "2a5b468085dd88b32271fb5a7281efe6c26d352458df22a5fdf35e22f8b2f806" }

[feature.vep-rs.target.osx-arm64.dependencies]
vep-rs = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/vep-rs-1/vep-rs-0.5.0-osxarm64_wgse_1.conda", sha256 = "8054a1663a2d90026c657d22e209ad00062b95d761a28a84e41449bafb6f6933" }

[feature.vep-rs.target.win-64.dependencies]
vep-rs = { url = "https://github.com/WGSExtract/wgsextract-cli/releases/download/vep-rs-1/vep-rs-0.5.0-win64_wgse_1.conda", sha256 = "601b82755ccb7817d4ae5ae42085c89b067de52ec72628971539383b070153b8" }

[feature.pysam.target.unix.pypi-dependencies]
# pysam has no native Windows build.
pysam = ">=0.24.1,<0.25"

# Cyrius calls CYP2D6 star alleles from a WGS BAM/CRAM (`typing cyp2d6`). Its
# PolyForm Strict license allows noncommercial use only, so it's an opt-in
# environment (`pixi install -e cyrius`) that the CLI runs automatically.
[feature.cyrius]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.cyrius.dependencies]
python = "3.12.*"
numpy = ">=2"
scipy = ">=1.14"
statsmodels = ">=0.14"

[feature.cyrius.pypi-dependencies]
# Brings pysam's PyPI wheel (a conda pysam would be installed twice).
cyrius = "==1.1.1"

# SMNCopyNumberCaller calls SMN1/SMN2 copy number from a WGS BAM/CRAM
# (`typing smn`). Upstream (Illumina) is archived; v1.1.2 is the last
# Apache-2.0 release (later commits relicensed to PolyForm Strict), so it's
# pinned. Opt-in environment (`pixi install -e smn`) that the CLI runs
# automatically. Bioconda's noarch package needs pysam, which isn't built for
# Windows.
[feature.smn]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.smn.dependencies]
python = "3.12.*"
smncopynumbercaller = "==1.1.2"
numpy = ">=2"
pysam = ">=0.23"

# Optional report aggregation; never installed by command invocation.
[feature.multiqc.pypi-dependencies]
multiqc = ">=1.32,<2"

# Optional Parquet table output (`--format parquet`); never installed by
# command invocation. pyarrow publishes no Windows ARM64 build, so there the
# commands stop with a clear error and TSV remains available.
[feature.parquet.pypi-dependencies]
pyarrow = ">=14"

# Optional MCP over streamable HTTP (`serve --mcp-http`): the official MCP
# Python SDK; never installed by command invocation.
# conda-forge's build: PyPI has no cryptography wheel for Intel macOS, and
# building it from source needs Rust.
[feature.mcp.dependencies]
cryptography = "*"

[feature.mcp.pypi-dependencies]
mcp = ">=2.3,<3"

# Developer tooling (tests, lint, type checking, packaging, site/CI checks).
# Kept out of the default environment that end-user installers set up; tasks
# defined here run in the `dev` environment automatically.
[feature.lint.dependencies]
python = "3.13.*"
ruff = ">=0.17.1,<0.18"
mypy = ">=2.3.1,<3"
actionlint = ">=1.7.12,<2"

[feature.lint.pypi-dependencies]
# Mypy targets Python 3.10, so it needs the typed tomllib fallback.
tomli = ">=2.0.1"

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=6,<9"
pytest-xdist = ">=3.8,<4"
pre-commit = ">=4.6.2,<5"
uv = ">=0.13.1,<0.14"
nodejs = ">=24"
jsonschema = ">=4.23,<5"
markdown-it-py = ">=3,<5"

[feature.dev.tasks]
pytest = "pytest"
ruff = "ruff"
mypy = "mypy"
pre-commit = "pre-commit"
test = "pytest --ignore=tests/test_e2e_fast_chrM.py --ignore=tests/test_e2e_full_genome.py --ignore=tests/test_microarray_real_data.py"
test-ci = "python -c \"from pathlib import Path; Path('out').mkdir(exist_ok=True)\" && pytest -n auto --dist loadgroup --cov=wgsextract_cli --cov-report=term-missing:skip-covered --cov-report=xml:out/coverage.xml --junitxml=out/pytest.xml --durations=25 --basetemp=out/pytest-tmp --ignore=tests/test_e2e_fast_chrM.py --ignore=tests/test_e2e_full_genome.py --ignore=tests/test_microarray_real_data.py"
test-e2e = "pytest tests/test_e2e_fast_chrM.py tests/test_e2e_full_genome.py tests/test_microarray_real_data.py"
test-e2e-fake = "pytest --fake-data tests/test_e2e_fast_chrM.py tests/test_e2e_full_genome.py"
test-remote = "pytest -m remote tests/test_remote_resources.py tests/test_remote_downloads.py tests/test_remote_benchmark.py"
smoke-test = "pytest tests/test_smoke.py tests/test_smoke_real_basics.py tests/test_smoke_real_vcf.py tests/test_smoke_real_vcf_ann.py tests/test_smoke_real_expert.py tests/test_smoke_real_ref.py"
smoke-test-full = "pytest tests/test_smoke.py tests/test_smoke_real_basics.py tests/test_smoke_real_vcf.py tests/test_smoke_real_vcf_ann.py tests/test_smoke_real_expert.py tests/test_smoke_real_ref.py tests/test_smoke_real_full.py tests/test_smoke_real_pet.py"
actionlint = "actionlint"
validate-actions = "python scripts/validate_github_actions.py"
lint = "ruff check . && python scripts/validate_site_sources.py && actionlint && python scripts/validate_github_actions.py"
format = "ruff format ."
typecheck = "mypy src/wgsextract_cli"
test-smells = { cmd = "python scripts/test_smells.py", description = "Advisory: flag change-detector patterns in test lines added since origin/main." }
package-smoke = "python scripts/package_smoke.py"
jscpd = "npx --yes jscpd@5.4.2 src/wgsextract_cli --reporters console,json --output out/jscpd --min-lines 5 --min-tokens 50 --ignore '**/__pycache__/**' --ignore '**/.mypy_cache/**'"
site-build = "python scripts/build_site.py"
gen-command-docs = { cmd = "python scripts/gen_command_docs.py", description = "Regenerate docs/commands.md and the site CLI page's command cards from the command metadata." }
stats = "python scripts/project_stats.py"
stats-report = "python scripts/project_stats.py out/project_stats.txt"
benchmark-dataset = { cmd = "python scripts/build_benchmark_dataset.py", description = "Rebuild the release-backed hg19 mini-genome benchmark dataset archive." }

[feature.dev.target.osx-arm64.pypi-dependencies]
vncdotool = ">=1.2, <2"

[feature.dev.target.linux-aarch64.dependencies]
# Qualify the same test runner as x64, not a newly released pytest.
pytest = "==9.2.0"

[environments]
default = { features = ["bio-tools", "pysam"], solve-group = "default" }
dev = { features = ["bio-tools", "pysam", "dev", "lint", "multiqc", "parquet", "mcp"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }
multiqc = { features = ["multiqc"], solve-group = "default" }
parquet = { features = ["bio-tools", "pysam", "parquet"], solve-group = "default" }
mcp = { features = ["bio-tools", "pysam", "mcp"], solve-group = "default" }
gatk = { features = ["gatk"], no-default-feature = true }
freebayes = { features = ["freebayes"], no-default-feature = true }
bwa-mem3 = { features = ["bwa-mem3"], no-default-feature = true }
t1k = { features = ["t1k"], no-default-feature = true }
expansionhunter = { features = ["expansionhunter"], no-default-feature = true }
longtr = { features = ["longtr"], no-default-feature = true }
strkit = { features = ["strkit"], no-default-feature = true }
pacbio = { features = ["bio-tools", "pacbio"], no-default-feature = true, solve-group = "pacbio-unix" }
vep = { features = ["vep"], no-default-feature = true }
vep-rs = { features = ["vep-rs"], no-default-feature = true }
pharmcat = { features = ["pharmcat"], no-default-feature = true }
cyrius = { features = ["cyrius"], no-default-feature = true }
clair3 = { features = ["clair3"], no-default-feature = true }
modkit = { features = ["modkit"], no-default-feature = true }
verifybamid2 = { features = ["verifybamid2"], no-default-feature = true }
somalier = { features = ["somalier"], no-default-feature = true }
phasing = { features = ["phasing"], no-default-feature = true }
smn = { features = ["smn"], no-default-feature = true }

[pypi-dependencies]
# pysam is platform-specific (no native Windows build); see feature.pysam.
wgsextract-cli = { path = ".", editable = true }

[tasks]
deps-check = "wgsextract deps check"
clean = { cmd = "python scripts/clean_outputs.py", description = "Remove gitignored scratch dirs (out/, tmp/)." }
gc = { cmd = "python scripts/installlab/lab.py gc", description = "Remove expired install-lab runs, images and leftovers (--dry-run to preview)." }
