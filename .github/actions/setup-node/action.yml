name: Node with main-owned npm cache
description: Share lockfile-keyed npm downloads without PR-scoped cache writes.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false
    - shell: bash
      run: npm config set cache "$GITHUB_WORKSPACE/.npm"
    - uses: ./.github/actions/download-cache
      with:
        path: .npm
        key: npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gui/app/package-lock.json') }}
