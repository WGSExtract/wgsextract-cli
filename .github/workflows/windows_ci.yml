name: CI Windows

# Native Windows uses the same published Pixi tools as users.
# pr_ci.yml selects PRs and merge groups; nightly is the full backstop.
on:
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      matrix:
        type: string
      smoke-only:
        type: boolean
        default: false
      platform-certified:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-windows-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly_guard.yml
    with:
      shard-os: windows
  imputation-install:
    # A local certificate can prove the tests, not a first-time locked install.
    if: inputs.platform-certified && !inputs.smoke-only && contains(inputs.tests, 'tests/test_imputation.py')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          install: "false"
      - run: pixi install --locked -e imputation
  test-windows:
    needs: nightly
    if: ${{ !cancelled() && !inputs.platform-certified && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: windows
      runner: windows-latest
      timeout-minutes: 54
      environments: default dev gatk vep-rs fastvep
      tests: ${{ inputs.tests || 'all' }}
      matrix: ${{ inputs.matrix || needs.nightly.outputs.matrix }}
      smoke-only: ${{ inputs.smoke-only == true }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}
      # The merge queue records passing tests; the nightly reruns the full suite.
      queue-dedupe: true
