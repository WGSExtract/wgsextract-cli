name: CI Windows

# Native Windows, as users run it: every tool comes from the Pixi environment
# (WGS Extract's own Windows builds of the bioinformatics tools). Lint and type
# checks run on Ubuntu.
# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    uses: ./.github/workflows/os_tests.yml
    with:
      os: windows
      runner: windows-latest
      timeout-minutes: 45
      environments: default dev gatk vep-rs
