name: CI Windows

# Native Windows uses the same published Pixi tools as users.
# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix
# (main pushes run the files their merge group left to them, #1373).
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      matrix:
        type: string
      smoke-only:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-windows-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly_guard.yml
    with:
      workflow: windows_ci.yml
      shard-os: windows
  test-windows:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: windows
      runner: windows-latest
      timeout-minutes: 54
      environments: default dev gatk vep-rs fastvep
      tests: ${{ inputs.tests || 'all' }}
      matrix: ${{ inputs.matrix || needs.nightly.outputs.matrix }}
      smoke-only: ${{ inputs.smoke-only == true }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}
      # The merge queue runs this suite, so main skips what it already ran (#1373).
      queue-dedupe: true
