name: CI Windows

# Native Windows uses the same published Pixi tools as users.
# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    if: inputs.tests != '[]'
    uses: ./.github/workflows/os_tests.yml
    with:
      os: windows
      runner: windows-latest
      timeout-minutes: 45
      environments: default dev gatk vep-rs
      tests: ${{ inputs.tests || 'all' }}
      smoke-only: ${{ inputs.smoke-only == true }}
