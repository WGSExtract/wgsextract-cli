name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/apt-install/**
      - .github/actions/download-cache/**
      - .github/actions/setup-gui/**
      - .github/actions/setup-pixi/**
      - "!**/*.md"
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/apt-install/**
      - .github/actions/download-cache/**
      - .github/actions/setup-gui/**
      - .github/actions/setup-pixi/**
      - "!**/*.md"

env:
  WGSEXTRACT_TOOL_RUNTIME: native

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi and the project environment
        uses: ./.github/actions/setup-pixi
        with:
          environments: default dev
          locked: "false"
      - name: Verify CLI imports
        run: pixi run wgsextract --help >/dev/null
      # The desktop app (gui/): its Node tooling, and the Linux libraries its
      # Tauri shell builds against.
      - name: Set up the app's Node tooling and Linux libraries
        timeout-minutes: 45
        uses: ./.github/actions/setup-gui
        with:
          tauri-linux-libraries: "true"
