name: CI Linux ARM64

# pr_ci.yml selects PRs; nightly is the full backstop.
on:
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "53 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-arm64-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-arm64:
    if: ${{ !cancelled() && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: linux-arm64
      runner: ubuntu-24.04-arm
      timeout-minutes: 21
      environments: default dev vep fastvep
      matrix: '[{"label":"native"}]'
      tests: ${{ inputs.tests || 'all' }}
      smoke-only: ${{ inputs.smoke-only == true }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}
