name: CI Linux ARM64

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ARM64 keeps its complete suite in one job (docs/ci_routing.md).
  native-arm64:
    uses: ./.github/workflows/os_tests.yml
    with:
      os: linux-arm64
      runner: ubuntu-24.04-arm
      timeout-minutes: 90
      environments: default dev vep
      matrix: '[{"tier": "all", "shard": "all", "label": "native"}]'
