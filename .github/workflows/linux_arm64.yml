name: CI Linux ARM64

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [main]
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native runner architecture
        run: test "$(uname -m)" = aarch64
      - name: Set up native Pixi environments
        uses: ./.github/actions/setup-pixi
        with:
          environments: >-
            default
            dev
            vep
          writer: "true"
      - name: Check installed tools and VEP
        run: |
          pixi run wgsextract deps check
          pixi run --no-install wgsextract lineage y-haplogroup --help > /dev/null
          pixi run -e vep --no-install vep --help > /dev/null
      - name: Test installer
        run: scripts/test_install_sh.sh
      - name: Run tests and native generated-genome end-to-end suite
        shell: bash
        run: |
          coverage=()
          if [ "${{ github.event_name }}" != pull_request ]; then
            coverage+=(--cov=wgsextract_cli --cov-report=xml:out/coverage.xml)
          fi
          pixi run test-ci --ci-skip-independent "${coverage[@]}"
          pixi run pytest --fake-data tests/test_e2e_fast_chrM.py tests/test_e2e_full_genome.py --basetemp=out/arm64-e2e-tmp --junitxml=out/arm64-e2e.xml
      - name: Publish native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linux-arm64
          path: |
            out/pytest.xml
            out/coverage.xml
            out/arm64-e2e.xml
