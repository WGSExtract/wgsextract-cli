name: CI Linux ARM64

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-arm64-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-arm64:
    if: inputs.tests != '[]'
    uses: ./.github/workflows/os_tests.yml
    with:
      os: linux-arm64
      runner: ubuntu-24.04-arm
      timeout-minutes: 21
      environments: default dev vep
      matrix: '[{"tier": "all", "shard": "all", "label": "native"}]'
      tests: ${{ inputs.tests || 'all' }}
      smoke-only: ${{ inputs.smoke-only == true }}
