name: Plan full OS test shards

on:
  workflow_call:
    inputs:
      shard-os:
        required: true
        type: string
    outputs:
      matrix:
        value: ${{ jobs.check.outputs.matrix }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Size the full hosted pytest matrix
        id: shards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_OS: ${{ inputs.shard-os }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then exit 0; fi
          flags=()
          if [ "$SHARD_OS" != ubuntu ]; then flags+=(--skip-independent); fi
          timeout 45 python3 -m scripts.ci_test_shards --os "$SHARD_OS" "${flags[@]}" \
            --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
