name: Reuse green main for nightly

on:
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      main-backstop-candidate:
        description: Also check a potential manual Ubuntu backstop on main.
        type: boolean
        default: false
      shard-os:
        type: string
    outputs:
      skip:
        value: ${{ jobs.check.outputs.skip }}
      matrix:
        value: ${{ jobs.check.outputs.matrix }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.main-backstop-candidate || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.shard-os != '')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.main.outputs.skip }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: main
        if: github.event_name == 'schedule' || inputs.main-backstop-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
        shell: bash
        run: |
          # Actions expression comparisons ignore case; Git refs do not.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then exit 0; fi
          python3 scripts/ci_nightly.py --repository "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - name: Size the full hosted pytest matrix
        id: shards
        if: ${{ !cancelled() && inputs.shard-os != '' && steps.main.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_OS: ${{ inputs.shard-os }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then exit 0; fi
          flags=()
          if [ "$SHARD_OS" != ubuntu ]; then flags+=(--skip-independent); fi
          timeout 45 python3 -m scripts.ci_test_shards --os "$SHARD_OS" "${flags[@]}" \
            --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
