name: GUI distribution

# Builds the WGS Extract desktop app (gui/) for Linux, macOS (Apple Silicon and
# Intel) and Windows.
# - Run by hand (Actions > GUI distribution > Run workflow, or
#   `gh workflow run gui-distribution.yml --ref BRANCH`): builds the installers
#   as artifacts, to try a change before releasing it.
# - Dispatched by Release: build signed installers and the feed as artifacts.
#   Only Release can upload the preflight assets to its draft.
# - Run by hand with a tag: rebuild assets for an already public release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          An existing vX.Y.Z tag to build the signed app for
          (empty: only build artifacts from the chosen branch)
        required: false
        type: string
      candidate:
        description: Prepare release assets without uploading them to the draft.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tauri:
    uses: ./.github/workflows/gui-build.yml
    with:
      ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      tag: ${{ inputs.tag }}
    secrets: inherit

  assets:
    name: Prepare signed release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tauri
    if: inputs.tag != ''
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use this workflow's validator even when rebuilding an older tag.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Generate updater feeds
        env:
          EXPECTED_TARGETS: ${{ needs.tauri.outputs.targets }}
        run: |
          python3 gui/tools/packaging/generate_update_feeds.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "${RELEASE_TAG#v}" \
            --expected-targets "$EXPECTED_TARGETS" \
            --artifacts-root release-artifacts \
            --output-dir updater-feed

      - name: Stage release assets
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              *.sig|*.app.tar.gz|*.dmg|*.AppImage|*.deb|*.rpm|*.pkg.tar.zst|*-setup.exe|*-quick-uninstall.ps1)
                asset_name="${name// /.}"
                cp "$file" "release-assets/$asset_name"
                ;;
            esac
          done
          test -n "$(find release-assets -type f -print -quit)"
          cp updater-feed/latest.json release-assets/
          find release-assets -type f -print | sort

      - name: Store the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Repair an already public release
    needs: assets
    if: inputs.tag != '' && !inputs.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-release-assets
          path: release-assets
      - name: Upload the app to the release
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::Only Release preflight may supply assets for a draft."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
