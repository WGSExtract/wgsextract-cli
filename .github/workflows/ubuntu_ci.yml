name: CI Ubuntu

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
      platform-certified:
        type: boolean
        default: false
      generic-certified:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
    inputs:
      optional-tools-only:
        description: Run only the cheap optional-tool integrations (branch validation).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-ubuntu-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly_guard.yml
    with:
      workflow: ubuntu_ci.yml
  lint:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && !inputs.optional-tools-only && !inputs.smoke-only && !inputs.generic-certified }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up lint-only Pixi environment
        uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
          writer: "true"
      - name: Lint, workflow validation and strict type check
        run: |
          pixi run -e lint -x ruff check .
          pixi run -e lint -x python scripts/check_python_size.py
          pixi run -e lint -x python scripts/validate_site_sources.py
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py
          pixi run -e lint -x mypy src/wgsextract_cli
          pixi run -e lint -x mypy --platform darwin src/wgsextract_cli
          pixi run -e lint -x mypy --platform win32 src/wgsextract_cli
      - name: Advisory test-smell annotations (never fails)
        run: pixi run -e lint -x python scripts/test_smells.py --base HEAD^1 --github
  test-ubuntu:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && !inputs.optional-tools-only && !inputs.platform-certified && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: ubuntu
      runner: ubuntu-latest
      timeout-minutes: 48
      environments: default dev vep-rs fastvep
      reference: true
      tests: ${{ inputs.tests || 'all' }}
      smoke-only: ${{ inputs.smoke-only == true }}
      skip-generic: ${{ github.event_name == 'pull_request' }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}

  optional-tools:
    needs: nightly
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && !inputs.smoke-only && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_contamination.py') || contains(inputs.tests, 'tests/test_vcf_callers.py') || contains(inputs.tests, 'tests/test_typing_str_long_reads.py') || contains(inputs.tests, 'tests/test_methylation.py') || contains(inputs.tests, 'tests/test_genotyping_commands.py')) }}
    uses: ./.github/workflows/optional_tools.yml
    with:
      tests: ${{ inputs.tests || 'all' }}

  imputation:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && !inputs.optional-tools-only && !inputs.platform-certified && !inputs.smoke-only && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_imputation.py')) }}
    # GLIMPSE2 and Beagle from the opt-in imputation environment on HG002 1x
    # reads and chip genotypes (tests/fixtures/imputation_hg002).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          environments: >-
            dev
            imputation
      - name: Run imputation tests
        shell: bash
        run: |
          mkdir -p out
          pixi run -e dev pytest tests/test_imputation.py -rs | tee out/imputation.txt
          ! grep -q skipped out/imputation.txt

  # ONT end to end on real GIAB HG002 R10.4.1 reads (tests/fixtures/ont_hg002):
  # align with minimap2, then Sniffles from the opt-in pacbio environment.
  ont-hg002:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && !inputs.optional-tools-only && !inputs.platform-certified && !inputs.smoke-only && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_ont_hg002.py') || contains(inputs.tests, 'tests/test_phasing.py') || contains(inputs.tests, 'tests/test_somalier_relate.py')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          environments: >-
            dev
            pacbio
            phasing
            somalier
      # Clair3's environment is too large for CI; the rest must run, not skip.
      - name: Run ONT HG002 fixture tests
        shell: bash
        run: |
          mkdir -p out
          pixi run -e dev pytest tests/test_ont_hg002.py tests/test_phasing.py tests/test_somalier_relate.py -k "not clair3" -rs | tee out/ont-hg002.txt
          ! grep -q skipped out/ont-hg002.txt
