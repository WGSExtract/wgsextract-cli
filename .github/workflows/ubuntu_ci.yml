name: CI Ubuntu

# The desktop app (gui/) has its own CI (gui-*.yml); app-only changes skip this.
on:
  push:
    branches: [ main ]
    paths:
      - "**"
      - "!gui/**"
      - "!.github/workflows/gui-*.yml"
      # tests/test_bump_version.py bumps the app's CLI pin in these.
      - gui/scripts/bump-wgsextract-cli.py
      - gui/examples/WGSExtract/scripts/wgsextract-release-tag.txt
      - gui/examples/WGSExtract/manifest.json
      - gui/docs/distribution.md
      - gui/docs/CHANGELOG.md
      - gui/app/tests/conformance.test.mjs
      - gui/tools/packaging/tests/test_embedded_branding.py
  pull_request:
    branches: [ main ]
    paths:
      - "**"
      - "!gui/**"
      - "!.github/workflows/gui-*.yml"
      # tests/test_bump_version.py bumps the app's CLI pin in these.
      - gui/scripts/bump-wgsextract-cli.py
      - gui/examples/WGSExtract/scripts/wgsextract-release-tag.txt
      - gui/examples/WGSExtract/manifest.json
      - gui/docs/distribution.md
      - gui/docs/CHANGELOG.md
      - gui/app/tests/conformance.test.mjs
      - gui/tools/packaging/tests/test_embedded_branding.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up lint-only Pixi environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: lint
          # PR runs restore main's environment; writing their own crowds it out.
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint, workflow validation and strict type check
        run: |
          pixi run -e lint -x ruff check .
          pixi run -e lint -x python scripts/validate_site_sources.py
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py
          pixi run -e lint -x mypy src/wgsextract_cli
      - name: Advisory test-smell annotations (never fails)
        run: pixi run -e lint -x python scripts/test_smells.py --base HEAD^1 --github
  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            default
            dev
            vep-rs
          # PR runs restore main's environment; writing their own crowds it out.
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Test installer
        run: scripts/test_install_sh.sh
      - name: Verify Tools
        run: chmod +x scripts/verify_tools.sh && pixi run scripts/verify_tools.sh
      # UCSC is often unresolvable from runners (#667). Bootstrap keeps a chain
      # already in the library, so restore the newest cached one and keep it only
      # if it has the pinned SHA-256. Each save gets its own key, so a bad entry
      # never blocks a good one from being saved and restored after it.
      - name: Pinned hg19ToHg38 chain checksum
        id: chain
        run: pixi run python -c 'import os; from wgsextract_cli.core.microarray_targets import HG19_TO_HG38_CHAIN as c; open(os.environ["GITHUB_OUTPUT"], "a").write(f"sha256={c.sha256}\n")'
      - name: Restore the hg19ToHg38 liftOver chain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/hg19ToHg38.over.chain.gz
          key: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}-${{ github.run_id }}
          restore-keys: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}-
      - name: Keep a restored chain only if it has the pinned SHA-256
        id: restored
        env:
          CHAIN_SHA256: ${{ steps.chain.outputs.sha256 }}
        run: |
          chain=reference/hg19ToHg38.over.chain.gz
          if [ -f "$chain" ] && echo "$CHAIN_SHA256  $chain" | shasum -a 256 -c --status; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$chain" ]; then
            echo "::warning::Cached $chain failed its SHA-256; downloading it again."
            rm -f "$chain"
          fi
      - name: Configure and Bootstrap Library
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run python -c "from wgsextract_cli.core.config import save_config; save_config({'reference_library': 'reference'})"
          pixi run python -m wgsextract_cli.main ref bootstrap --ref reference
      - name: Check the downloaded chain before caching it
        id: downloaded
        if: steps.restored.outputs.verified != 'true'
        env:
          CHAIN_SHA256: ${{ steps.chain.outputs.sha256 }}
        run: echo "$CHAIN_SHA256  reference/hg19ToHg38.over.chain.gz" | shasum -a 256 -c
      - name: Cache the downloaded hg19ToHg38 liftOver chain
        if: steps.downloaded.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/hg19ToHg38.over.chain.gz
          key: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}-${{ github.run_id }}
      - name: Cache public hs38 reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/genomes
          key: hs38-v1-${{ hashFiles('src/wgsextract_cli/assets/reference/seed_genomes.csv', 'src/wgsextract_cli/core/ref_library/catalog.py') }}
      - name: Install Reference Genome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run python -m wgsextract_cli.main ref library --install hs38 --ref reference
      - name: Build and Smoke Test Package
        run: pixi run package-smoke
      - name: Run Benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run wgsextract benchmark --dataset real --profile smoke
          echo "Benchmark timing is published in this job summary."
      - name: Run Tests
        run: pixi run test-ci
      # The app's bundle commands must still parse with this CLI (#538); GUI CI
      # checks the bundle side, this catches a CLI flag dropped or renamed.
      - name: Check the app's bundle commands parse with this CLI
        working-directory: gui
        run: pixi run python -m unittest discover -s tests/wgsextract
      - name: Publish test timings and non-gating coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-ubuntu
          path: |
            out/coverage.xml
            out/pytest.xml
      # Each extract, call and annotate command run end to end on generated chrM
      # and whole-genome data; about 30 s, no downloads.
      - name: Run end-to-end tests on generated data
        run: pixi run test-e2e-fake

  imputation:
    # GLIMPSE2 and Beagle from the opt-in imputation environment on HG002 1x
    # reads and chip genotypes (tests/fixtures/imputation_hg002).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            dev
            imputation
      - name: Run imputation tests
        shell: bash
        run: |
          mkdir -p out
          pixi run -e dev pytest tests/test_imputation.py -rs | tee out/imputation.txt
          ! grep -q skipped out/imputation.txt

  # ONT end to end on real GIAB HG002 R10.4.1 reads (tests/fixtures/ont_hg002):
  # align with minimap2, then Sniffles from the opt-in pacbio environment.
  ont-hg002:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            dev
            pacbio
            phasing
            somalier
          # PR runs restore main's environment; writing their own crowds it out.
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      # Clair3's environment is too large for CI; the rest must run, not skip.
      - name: Run ONT HG002 fixture tests
        shell: bash
        run: |
          mkdir -p out
          pixi run -e dev pytest tests/test_ont_hg002.py tests/test_phasing.py tests/test_somalier_relate.py -k "not clair3" -rs | tee out/ont-hg002.txt
          ! grep -q skipped out/ont-hg002.txt
