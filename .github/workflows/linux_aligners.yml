name: Linux Aligners

# Builds WGS Extract's Linux conda packages from native/ on every change to them:
# wgse-bwa (packaging/wgse-bwa: BWA 0.7.19; linux-64 with its experimental CUDA
# backend, linux-aarch64 with NEON on the CPU), wgse-bwa-mem3
# (packaging/wgse-bwa-mem3: bwa-mem3 0.16.0, linux-64 with its CUDA backend) and
# wgse-minimap2 (packaging/wgse-minimap2: minimap2 2.31, linux-64 with its CUDA backend).
# It runs native/'s tests on both architectures, and publishes the packages to a
# release when asked:
# Actions > Linux Aligners > Run workflow, with a new tag such as linux-aligners-1.
# Then pin pixi.toml to the new asset's URL and SHA-256. The runner has no GPU:
# the package's tests align on the CPU and check that CUDA reports itself
# unavailable rather than failing.

on:
  pull_request:
    branches: [ main ]
    paths:
      - native/**
      - packaging/wgse-bwa/**
      - packaging/wgse-bwa-mem3/**
      - packaging/wgse-minimap2/**
      - .github/workflows/linux_aligners.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the packages under (empty builds only).
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CPU build's tests, which the packages (built without them) skip: the
      # exact NEON seed extension against upstream's (ARM64), batched mate rescue
      # and seed extension against upstream's, and the smoke alignment; GPU tests skip.
      - name: Build and test (development build)
        run: |
          cmake -S native -B out/build-test -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR="$PWD/out/deps"
          cmake --build out/build-test -j "$(nproc)"
          ctest --test-dir out/build-test --output-on-failure

  # The CUDA backends (wgse-bwa and wgse-bwa-mem3) with their tests, compiled only: the
  # runner has no GPU, so their GPU tests would skip. The packages build wgse-bwa's alone.
  cuda-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Build with -DWGSE_CUDA=ON
        run: |
          # cuda-nvcc brings conda-forge's GCC, which sets CC and CXX and has its own sysroot,
          # so zlib comes from conda-forge too. The script runs inside that environment.
          # shellcheck disable=SC2016
          pixi exec --spec "cuda-nvcc 12.9.*" --spec "cuda-cudart-dev 12.9.*" \
            --spec "cuda-cudart-static 12.9.*" --spec zlib -- bash -euo pipefail -c '
              nvcc --version | tail -1
              cmake -S native -B out/build-cuda -DCMAKE_BUILD_TYPE=Release -DWGSE_CUDA=ON \
                -DCMAKE_CUDA_COMPILER="$(command -v nvcc)" \
                -DCUDAToolkit_ROOT="$(dirname "$(dirname "$(command -v nvcc)")")" \
                -DFETCHCONTENT_BASE_DIR="$PWD/out/deps"
              cmake --build out/build-cuda -j "$(nproc)"
              out/build-cuda/bwa-mem3/wgse-bwa-mem3 capabilities --json
              out/build-cuda/bwa-mem3/wgse-bwa-mem3 capabilities --json | grep -q "\"cuda_available\":false"'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-64
            package: wgse-bwa
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            package: wgse-bwa
          - runner: ubuntu-latest
            platform: linux-64
            package: wgse-bwa-mem3
          - runner: ubuntu-latest
            platform: linux-64
            package: wgse-minimap2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Build and test the package
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build --recipe-dir packaging/${{ matrix.package }} \
            -m packaging/${{ matrix.package }}/variants.yaml --output-dir out/conda --target-platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}-${{ matrix.platform }}
          path: out/conda/${{ matrix.platform }}/*.conda
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [ build, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wgse-*
          path: packages
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in linux-aligners-*) ;; *) echo "Tag must start with linux-aligners-" >&2; exit 1 ;; esac
          mkdir -p assets
          cp packages/*/*.conda assets/
          {
            echo "WGS Extract's Linux (x86-64 and ARM64) aligner builds as conda packages that Pixi installs."
            echo "Built from native/ and packaging/ at ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "| Package | SHA-256 |"
            echo "| --- | --- |"
            for f in assets/*.conda; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > notes.md
          gh release create "$TAG" assets/*.conda \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Linux aligners $TAG" \
            --notes-file notes.md --prerelease --latest=false
