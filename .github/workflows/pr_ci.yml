name: PR area checks
run-name: PR area checks / ${{ github.event.action }} / ${{ github.event_name == 'merge_group' && 'queue' || github.event.pull_request.draft && 'draft' || 'ready' }}

on:
  pull_request:
    # converted_to_draft enters concurrency to cancel ready work; all jobs skip.
    # Labels must not create skipped suites that shadow the passing required check.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The merge queue retests only the required set below against the latest main.
  merge_group:

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate delayed draft payloads from readiness; redrafting still cancels ready work.
  group: pr-area-${{ github.ref }}-diff${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
      docs: ${{ steps.diff.outputs.docs }}
      docs_tests: ${{ steps.diff.outputs.docs_tests }}
      site_validation: ${{ steps.diff.outputs.site_validation }}
      native: ${{ steps.diff.outputs.native }}
      site: ${{ steps.diff.outputs.site }}
      fast: ${{ steps.diff.outputs.fast }}
      draft_cli: ${{ steps.diff.outputs.draft_cli }}
      python_files: ${{ steps.diff.outputs.python_files }}
      routed: ${{ steps.diff.outputs.routed }}
      setup_checks: ${{ steps.diff.outputs.setup_checks }}
      move_modules: ${{ steps.diff.outputs.move_modules }}
      tests: ${{ steps.diff.outputs.tests }}
      optional_tests: ${{ steps.diff.outputs.optional_tests }}
      ci: ${{ steps.diff.outputs.ci }}
      ci_tests: ${{ steps.diff.outputs.ci_tests }}
      ubuntu_tests: ${{ steps.diff.outputs.ubuntu_tests }}
      macos_tests: ${{ steps.diff.outputs.macos_tests }}
      windows_tests: ${{ steps.diff.outputs.windows_tests }}
      arm64_tests: ${{ steps.diff.outputs.arm64_tests }}
      ubuntu_smoke: ${{ steps.diff.outputs.ubuntu_smoke }}
      macos_smoke: ${{ steps.diff.outputs.macos_smoke }}
      windows_smoke: ${{ steps.diff.outputs.windows_smoke }}
      arm64_smoke: ${{ steps.diff.outputs.arm64_smoke }}
      ubuntu_matrix: ${{ steps.linux-shards.outputs.ubuntu || (fromJSON(steps.shards.outputs.ubuntu || '[]')[1].label != 'shard-2' && steps.shards.outputs.ubuntu) || '' }}
      macos_matrix: ${{ steps.shards.outputs.macos }}
      windows_matrix: ${{ steps.shards.outputs.windows }}
      generic_tests: ${{ steps.diff.outputs.generic_tests }}
      # Certificates do not yet include move imports/full collection.
      linux_x64: ${{ steps.diff.outputs.move_modules == '[]' && steps.cert.outputs.linux_x64 || 'false' }}
      linux_arm64: ${{ steps.diff.outputs.move_modules == '[]' && steps.cert.outputs.linux_arm64 || 'false' }}
      macos_arm64: ${{ steps.diff.outputs.move_modules == '[]' && steps.cert.outputs.macos_arm64 || 'false' }}
      # The Windows imputation lane includes a fresh locked install, not just
      # testing the already-provisioned tool validated by local certification.
      windows_x64: &windows-certified ${{ steps.diff.outputs.move_modules == '[]' && (steps.diff.outputs.windows_smoke == 'true' || (steps.diff.outputs.windows_tests != 'all' && !contains(steps.diff.outputs.windows_tests, 'tests/test_imputation.py'))) && steps.cert.outputs.windows_x64 || 'false' }}
      generic: ${{ steps.cert.outputs.generic }}
    steps:
      - name: Check out the trusted base verifier
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .certification-base
          persist-credentials: false
      - name: Read writer certifications using only base code
        id: cert
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .certification-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/ci_certifications.py ]; then
            python3 -I scripts/ci_certifications.py --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
          else
            echo "Trusted base has no verifier; retaining all hosted checks."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route the complete PR diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL_SUITE: ${{ github.event_name == 'merge_group' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRAFT" = true ]; then flags+=(--draft); fi
          if [ "${FULL_SUITE:-false}" = true ]; then flags+=(--full-suite); fi
          python3 scripts/ci_changes.py --base "$BASE" --head "$HEAD" "${flags[@]}" --output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size the hosted pytest matrices
        id: shards
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          UBUNTU: ${{ steps.diff.outputs.ubuntu_smoke != 'true' && (steps.cert.outputs.linux_x64 != 'true' || steps.diff.outputs.move_modules != '[]') && steps.diff.outputs.ubuntu_tests || '[]' }}
          MACOS: ${{ steps.diff.outputs.macos_smoke != 'true' && (steps.cert.outputs.macos_arm64 != 'true' || steps.diff.outputs.move_modules != '[]') && steps.diff.outputs.macos_tests || '[]' }}
          WINDOWS: ${{ steps.diff.outputs.windows_smoke != 'true' && steps.diff.outputs.windows_tests || '[]' }}
          WINDOWS_CERTIFIED: *windows-certified
        run: |
          mkdir -p out/shard-timings
          for lane in ubuntu macos windows; do
            : > "out/shard-timings/$lane.outputs"
          done
          if [ "$UBUNTU" != '[]' ]; then
            timeout 45 python3 -m scripts.ci_test_shards --os ubuntu --selection "$UBUNTU" \
              --save-timings out/shard-timings/ubuntu.json \
              --pull-request --skip-independent --repository "$GITHUB_REPOSITORY" --output-name ubuntu --github-output out/shard-timings/ubuntu.outputs &
          fi
          if [ "$MACOS" != '[]' ]; then
            timeout 45 python3 -m scripts.ci_test_shards --os macos --selection "$MACOS" \
              --skip-independent --repository "$GITHUB_REPOSITORY" --output-name macos --github-output out/shard-timings/macos.outputs &
          fi
          if [ "$WINDOWS" != '[]' ] && [ "$WINDOWS_CERTIFIED" != true ]; then
            timeout 45 python3 -m scripts.ci_test_shards --os windows --selection "$WINDOWS" \
              --skip-independent --repository "$GITHUB_REPOSITORY" --output-name windows --github-output out/shard-timings/windows.outputs &
          fi
          wait
          cat out/shard-timings/{ubuntu,macos,windows}.outputs >> "$GITHUB_OUTPUT"
      - name: Set up the locked Python for the Linux shard selector
        id: shard-selector-setup
        if: fromJSON(steps.shards.outputs.ubuntu || '[]')[1].label == 'shard-2'
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/setup-pixi
        with:
          environments: dev
          writer: "false"
      - name: Fetch trusted Linux observations for the shard planner
        if: steps.shard-selector-setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_fetch
          --repository "$GITHUB_REPOSITORY" --base HEAD^1
          --output out/test-impact-map/linux.json.gz
      - name: Finalize the Linux pytest plan from one selector decision
        id: linux-shards
        if: steps.shard-selector-setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_SELECTION: ${{ steps.diff.outputs.ubuntu_tests }}
          SYMBOL_DISABLED: ${{ vars.CI_DISABLE_SYMBOL_SELECTION }}
        run: |
          flags=()
          if [ "$SYMBOL_DISABLED" = true ]; then flags+=(--disable-symbol-selection); fi
          timeout 90 pixi run -e dev --no-install python -m scripts.ci_test_shards \
            --os ubuntu --selection "$TEST_SELECTION" \
            --linux-observations out/test-impact-map/linux.json.gz "${flags[@]}" \
            --pull-request --skip-independent --timings out/shard-timings/ubuntu.json \
            --output-name ubuntu --github-output "$GITHUB_OUTPUT"
      - name: Prepare selector activation canary
        id: selector-setup
        if: github.event_name == 'pull_request' && contains(fromJSON(steps.diff.outputs.python_files), 'scripts/ci_impact_gate.py')
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/setup-pixi
        with:
          environments: dev
          writer: "false"
      - name: Fetch the Linux observation artifact for the activation canary
        if: steps.selector-setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_fetch
          --repository "$GITHUB_REPOSITORY" --base HEAD^1
          --output out/test-impact-map/linux.json.gz
      - name: Verify fresh Linux selector evidence on this change
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.selector-setup.outcome != 'skipped' && steps.selector-setup.outcome != '' }}
        continue-on-error: true
        env:
          TEST_SELECTION: ${{ steps.diff.outputs.tests }}
          SYMBOL_DISABLED: ${{ vars.CI_DISABLE_SYMBOL_SELECTION }}
        run: |
          set -o pipefail
          flags=()
          if [ "$SYMBOL_DISABLED" = true ]; then flags+=(--disabled); fi
          if ! timeout 60 pixi run -e dev --no-install python -m scripts.ci_impact_gate \
            --verify-wiring --event pull_request --base HEAD^1 --legacy "$TEST_SELECTION" \
            --observations out/test-impact-map/linux.json.gz \
            --output out/test-selection-canary.json "${flags[@]}" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo '::warning::Linux selector verification unavailable; the current selection remains in force when the gate cannot validate its inputs.'
            exit 1
          fi
      - name: Compare output contracts with the base's pinned baselines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: python3 scripts/output_contracts.py check --base "$BASE"
      # Stdlib-only and instant, so fragment-only PRs need no extra runner.
      # A release's queue commit must not leave late fragments unassembled.
      # PR runs check out the merge commit, whose first parent is the base it
      # was built on; the event's base.sha can be older.
      - name: Check release-note fragments
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/release_notes.py check --base "${QUEUE_BASE:-HEAD^1}"

  # Frees runners held by merge groups GitHub already invalidated (#1373). Not in
  # `required`'s needs, and the script only warns on API errors, so it never
  # fails or blocks a group.
  cancel-stale-queue:
    name: Cancel invalidated merge groups
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      # The write token runs only trusted base code, never queued PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Cancel runs whose queue ref was deleted
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          if [ ! -f scripts/ci_cancel_stale_queue.py ]; then
            echo "Trusted base has no queue cleanup; skipping."
            exit 0
          fi
          python3 -m scripts.ci_cancel_stale_queue --repository "$GITHUB_REPOSITORY" \
            --workflow pr_ci.yml --base "$BASE_REF" --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF"

  draft-fast:
    name: Draft lint and fast tests
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
      - name: Lint, workflow policy and type checks
        run: |
          pixi run -e lint -x ruff check .
          pixi run -e lint -x python scripts/check_python_size.py
          pixi run -e lint -x python scripts/validate_site_sources.py
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py
          pixi run -e lint -x mypy src/wgsextract_cli
          pixi run -e lint -x mypy --platform darwin src/wgsextract_cli
          pixi run -e lint -x mypy --platform win32 src/wgsextract_cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Fast routing and workflow regressions
        run: |
          python -m pip install --quiet -e . pytest pytest-xdist jsonschema
          mkdir -p out
          python -m pytest -q tests/test_ci_changes.py tests/test_github_actions_policy.py --basetemp=out/draft-tests

      - name: Fast product unit tests for CLI changes
        if: needs.changes.outputs.draft_cli == 'true'
        run: |
          python -m pytest -q tests/test_microarray_vendor_formats.py tests/test_table_writer.py --basetemp=out/draft-unit-tests

  docs:
    name: Documentation freshness
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.generic != 'true' && needs.changes.outputs.docs == 'true' && (needs.changes.outputs.docs_tests != '[]' || needs.changes.outputs.site_validation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.docs_tests != '[]'
        with:
          python-version: "3.13"
      - name: Install only Python documentation test dependencies
        if: needs.changes.outputs.docs_tests != '[]'
        run: python -m pip install --quiet -e . pytest jsonschema
      - name: Run input-selected documentation tests
        if: needs.changes.outputs.docs_tests != '[]'
        env:
          DOCS_TESTS: ${{ needs.changes.outputs.docs_tests }}
        run: |
          mkdir -p out
          python -c 'import json, os, subprocess, sys; subprocess.run([sys.executable, "-m", "pytest", "-q", *json.loads(os.environ["DOCS_TESTS"]), "--basetemp=out/docs-tmp"], check=True)'
      - name: Validate changed site sources without package installation
        if: needs.changes.outputs.site_validation == 'true'
        run: |
          python3 scripts/validate_site_sources.py
          python3 gui/scripts/validate_site_sources.py

  python-lint:
    name: Changed Python lint
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.generic != 'true' && needs.changes.outputs.python_files != '' && needs.changes.outputs.python_files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
      - name: Lint explicitly named files even under normally excluded GUI paths
        env:
          PYTHON_FILES: ${{ needs.changes.outputs.python_files }}
        run: |
          pixi run -e lint -x python - <<'PY'
          import json, os, subprocess, sys
          subprocess.run([sys.executable, "scripts/check_python_size.py"], check=True)
          files = json.loads(os.environ["PYTHON_FILES"])
          cli = [path for path in files if not path.startswith("gui/")]
          gui = [path for path in files if path.startswith("gui/")]
          if cli:
              subprocess.run(["ruff", "check", "--no-force-exclude", "--", *cli], check=True)
              subprocess.run(["ruff", "format", "--check", "--no-force-exclude", "--", *cli], check=True)
          if gui:
              # GUI Python has its own style policy; preserve its compile gate
              # and add fatal-error lint rather than imposing root formatting.
              subprocess.run([sys.executable, "-m", "compileall", "-q", *gui], check=True)
              subprocess.run(["ruff", "check", "--isolated", "--target-version", "py313", "--select", "E9,F63,F7,F82", "--", *gui], check=True)
          PY

  optional-tools:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.result == 'success' && needs.changes.outputs.optional_tests != '[]'
    uses: ./.github/workflows/optional_tools.yml
    with:
      tests: ${{ needs.changes.outputs.optional_tests }}

  ubuntu:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.result == 'success' && !(needs.changes.outputs.linux_x64 == 'true' && needs.changes.outputs.generic == 'true') && needs.changes.outputs.ubuntu_tests != '[]'
    uses: ./.github/workflows/ubuntu_ci.yml
    with:
      tests: ${{ needs.changes.outputs.ubuntu_tests }}
      matrix: ${{ needs.changes.outputs.ubuntu_matrix }}
      smoke-only: ${{ needs.changes.outputs.ubuntu_smoke == 'true' }}
      platform-certified: ${{ needs.changes.outputs.linux_x64 == 'true' }}
      generic-certified: ${{ needs.changes.outputs.generic == 'true' }}
      setup-checks: ${{ needs.changes.outputs.setup_checks == 'true' }}
      move-modules: ${{ needs.changes.outputs.move_modules }}
  macos:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.macos_arm64 != 'true' && needs.changes.result == 'success' && needs.changes.outputs.macos_tests != '[]' && github.event_name != 'merge_group'
    uses: ./.github/workflows/macos_ci.yml
    with:
      tests: ${{ needs.changes.outputs.macos_tests }}
      matrix: ${{ needs.changes.outputs.macos_matrix }}
      smoke-only: ${{ needs.changes.outputs.macos_smoke == 'true' }}
      setup-checks: ${{ needs.changes.outputs.setup_checks == 'true' }}
      move-modules: ${{ needs.changes.outputs.move_modules }}
  windows:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.windows_x64 != 'true' && needs.changes.result == 'success' && needs.changes.outputs.windows_tests != '[]'
    uses: ./.github/workflows/windows_ci.yml
    with:
      tests: ${{ needs.changes.outputs.windows_tests }}
      matrix: ${{ needs.changes.outputs.windows_matrix }}
      smoke-only: ${{ needs.changes.outputs.windows_smoke == 'true' }}
      setup-checks: ${{ needs.changes.outputs.setup_checks == 'true' }}
      move-modules: ${{ needs.changes.outputs.move_modules }}
  arm64:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.linux_arm64 != 'true' && needs.changes.result == 'success' && needs.changes.outputs.arm64_tests != '[]' && github.event_name != 'merge_group'
    uses: ./.github/workflows/linux_arm64.yml
    with:
      tests: ${{ needs.changes.outputs.arm64_tests }}
      smoke-only: ${{ needs.changes.outputs.arm64_smoke == 'true' }}
      setup-checks: ${{ needs.changes.outputs.setup_checks == 'true' }}
      move-modules: ${{ needs.changes.outputs.move_modules }}

  ci-policy:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.generic != 'true' && needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
      - run: |
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py
          pixi run -e lint -x python scripts/check_python_size.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run affected CI policy and routing tests
        env:
          CI_TESTS: ${{ needs.changes.outputs.ci_tests }}
        run: |
          python -m pip install --quiet -e . pytest pytest-xdist jsonschema coverage
          mkdir -p out
          python -c 'import json, os, subprocess, sys; subprocess.run([sys.executable, "-m", "pytest", "-q", *json.loads(os.environ["CI_TESTS"]), "--basetemp=out/ci-policy"], check=True)'
  generic:
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.changes.outputs.generic != 'true' && needs.changes.outputs.generic_tests != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: dev
      - env:
          TEST_SELECTION: ${{ needs.changes.outputs.generic_tests }}
        run: pixi run python scripts/ci_run_tests.py --selection "$TEST_SELECTION"
        shell: bash
  # The secret scan covers every ready PR and queue group, docs-only ones included.
  gitleaks:
    if: ${{ github.event.pull_request.draft != true }}
    uses: ./.github/workflows/gitleaks.yml

  native-smoke:
    name: Native CLI smoke
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -e .
      - run: |
          wgsextract --help
          wgsextract realign --help
          wgsextract deps check --help

  pages:
    name: Pages source checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.generic != 'true' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/validate_site_sources.py
          python3 scripts/build_site.py
          python3 gui/scripts/validate_site_sources.py
          python3 gui/scripts/build_site.py
          test -d gui/mockups

  ready-gate:
    name: Ready PR area checks
    needs: [changes, draft-fast, docs, python-lint, ci-policy, generic, optional-tools, ubuntu, macos, windows, arm64, native-smoke, pages]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require complete routing and successful selected checks
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          ROUTED: ${{ needs.changes.outputs.routed }}
          CHECKS_FAILED: ${{ contains(needs.*.result, 'failure') }}
          CHECKS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          test "$ROUTING_RESULT" = success
          test "$ROUTED" = true
          test "$CHECKS_FAILED" = false
          test "$CHECKS_CANCELLED" = false
          echo "All area-selected checks passed for this non-draft PR run."

  # The one required check for main's ruleset and merge queue (#758, merge queue). Path
  # routing skips jobs, so require this summary rather than each job. PRs
  # also require the area verdict; queue groups retain their smaller matrix.
  required:
    # A late skipped draft suite must never satisfy the ready run's required check.
    name: ${{ github.event.pull_request.draft && 'required (draft)' || 'required' }}
    needs: [changes, draft-fast, docs, python-lint, ci-policy, generic, optional-tools, ubuntu, windows, gitleaks, native-smoke, pages, ready-gate]
    # Run after failed dependencies, but let whole-run cancellation stop this
    # gate. A cancelled dependency in an otherwise active run still fails below.
    # Draft events allocate no runner, including this summary.
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require routing and every selected required job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          ROUTED: ${{ needs.changes.outputs.routed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS"]).items()}
          print("\n".join(f"{job}: {result}" for job, result in results.items()))
          # Path routing may skip a job only when routing itself succeeded.
          bad = [job for job, result in results.items() if result not in {"success", "skipped"}]
          # A PR must have an actual area verdict, not a skipped summary.
          if os.environ["EVENT_NAME"] == "pull_request" and results.get("ready-gate") != "success":
              bad.append("ready-gate")
          if results["changes"] != "success" or os.environ["ROUTED"] != "true" or bad:
              sys.exit(f"::error::Required checks did not pass: {', '.join(bad) or 'changes'}")
          PY
