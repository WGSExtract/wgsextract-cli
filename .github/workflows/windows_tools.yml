name: Windows Tools

# Builds WGS Extract's native Windows tool packages (packaging/windows/recipes)
# on every change to them, and publishes a set to a release when asked:
# Actions > Windows Tools > Run workflow, with a new tag such as windows-tools-2.
# For complete sets, pin pixi.toml: python packaging/windows/pin.py <tag>.
# Never use pin.py for partial releases; update only selected URL/SHA-256 pins.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main ]
    paths:
      - packaging/windows/**
      - native/CMakeLists.txt
      - native/bwa/**
      - native/bwa-mem2/rescue_prune.cpp
      - native/bwa-mem2/wgse_rescue_prune.h
      - native/gpu-common/**
      - native/minimap2/**
      - native/tests/**
      - native/windows/**
      - .github/workflows/windows_tools.yml
      - .github/actions/setup-pixi/**
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the packages under (empty builds only).
        required: false
        default: ""

permissions:
  contents: read

# Only pull requests share a group: a new push supersedes the PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true

      - name: Install the build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -v '^#' packaging/windows/msys2-packages.txt | xargs pacman -S --needed --noconfirm --noprogressbar
          pacman -S --needed --noconfirm --noprogressbar mingw-w64-ucrt-x86_64-ccache
          pacman -Q > out/msys2-packages-used.txt

      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          install: "false"

      - uses: ./.github/actions/compiler-cache
        with:
          scope: windows-tools
          recipe: ${{ hashFiles('packaging/windows/**', 'native/bwa/**', '.github/workflows/windows_tools.yml') }}
          compiler: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gcc.exe
          executable: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/ccache.exe

      - name: Build the packages
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $recipes = Get-ChildItem packaging/windows/recipes -Directory |
            Where-Object { $_.Name -notin 'wgse-bwa', 'wgse-minimap2' } |
            ForEach-Object { '--recipe'; $_.FullName }
          pixi exec --spec rattler-build==0.77.0 rattler-build build --no-build-id @recipes `
            --output-dir out/conda --target-platform win-64
          Move-Item out/msys2-packages-used.txt out/conda/win-64/

      - uses: ./.github/actions/compiler-cache
        with:
          phase: save
          scope: windows-tools
          recipe: ${{ hashFiles('packaging/windows/**', 'native/bwa/**', '.github/workflows/windows_tools.yml') }}
          compiler: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gcc.exe
          executable: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/ccache.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tools
          path: |
            out/conda/win-64/*.conda
            out/conda/win-64/msys2-packages-used.txt
          if-no-files-found: error

  cuda-aligners:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [wgse-bwa, wgse-minimap2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          install: "false"

      - name: Build with CUDA and test CPU fallback
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build --no-build-id `
            --recipe "packaging/windows/recipes/$env:PACKAGE" --channel conda-forge `
            --output-dir out/conda --target-platform win-64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tools-${{ matrix.package }}
          path: out/conda/win-64/${{ matrix.package }}-*.conda
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build, cuda-aligners]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-native-release
        with:
          tag: ${{ inputs.release_tag }}
          tag-prefix: windows-tools-
          title: Windows tools ${{ inputs.release_tag }}
          source: packaging/windows/recipes and native
          artifacts: windows-tools*
          extra-assets: msys2-packages-used.txt
          description: |
            Native Windows builds of WGS Extract's command-line tools, as conda packages that Pixi installs.
