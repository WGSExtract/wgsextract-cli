name: Windows Tools

# Builds WGS Extract's native Windows tool packages (packaging/windows/recipes)
# on every change to them, and publishes a set to a release when asked:
# Actions > Windows Tools > Run workflow, with a new tag such as windows-tools-2.
# For complete sets, pin pixi.toml: python packaging/windows/pin.py <tag>.
# Never use pin.py for partial releases; update only selected URL/SHA-256 pins.

on:
  pull_request:
    branches: [ main ]
    paths:
      - packaging/windows/**
      - .github/workflows/windows_tools.yml
      - .github/actions/setup-pixi/**
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the packages under (empty builds only).
        required: false
        default: ""

permissions:
  contents: read

# Only pull requests share a group: a new push supersedes the PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true

      - name: Install the build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -v '^#' packaging/windows/msys2-packages.txt | xargs pacman -S --needed --noconfirm --noprogressbar
          pacman -Q > out/msys2-packages-used.txt

      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          install: "false"

      - name: Build the packages
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build --recipe-dir packaging/windows/recipes `
            --output-dir out/conda --target-platform win-64
          Move-Item out/msys2-packages-used.txt out/conda/win-64/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tools
          path: |
            out/conda/win-64/*.conda
            out/conda/win-64/msys2-packages-used.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-native-release
        with:
          tag: ${{ inputs.release_tag }}
          tag-prefix: windows-tools-
          title: Windows tools ${{ inputs.release_tag }}
          source: packaging/windows/recipes
          artifacts: windows-tools
          extra-assets: msys2-packages-used.txt
          description: |
            Native Windows builds of WGS Extract's command-line tools, as conda packages that Pixi installs.
