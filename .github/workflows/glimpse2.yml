name: GLIMPSE2 Windows

# Builds GLIMPSE2 (packaging/glimpse2) natively for Windows, which Bioconda
# doesn't, on every change to it, and publishes the package to a release when
# asked: Actions > GLIMPSE2 Windows > Run workflow, with a new tag such as
# glimpse2-2. Then pin pixi.toml's imputation feature to the asset's URL and
# SHA-256. Linux and Intel macOS use Bioconda's glimpse-bio.

on:
  pull_request:
    branches: [ main ]
    paths:
      - packaging/glimpse2/**
      - packaging/windows/**
      - tests/fixtures/imputation_hg002/**
      - tests/test_imputation.py
      - .github/workflows/glimpse2.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the package under (empty builds only).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true

      - name: Install the build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -hv '^#' packaging/windows/msys2-packages.txt packaging/glimpse2/msys2-packages.txt \
            | xargs pacman -S --needed --noconfirm --noprogressbar
          pacman -Q > out/msys2-packages-used.txt

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Build and test the package
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build --recipe-dir packaging/glimpse2 `
            --output-dir out/conda --target-platform win-64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out/msys2-packages-used.txt out/conda/win-64/

      # Only this disposable CI checkout gets the unreleased package. Production
      # pixi.toml must wait for a release URL and SHA-256.
      - name: Smoke test native tools on HG002 outside MSYS2
        shell: pwsh
        run: |
          $package = Get-Item out/conda/win-64/glimpse-bio-*.conda
          pixi add --feature imputation $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi install -e dev -e imputation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run -e dev python -c "from wgsextract_cli.core.dependencies import get_tool_path; from wgsextract_cli.commands.vcf.imputation import beagle_command; from wgsextract_cli.core.pixi_tools import pixi_env_prefix; tools = ['bcftools', 'bgzip', 'tabix', 'GLIMPSE2_chunk', 'GLIMPSE2_split_reference', 'GLIMPSE2_phase', 'GLIMPSE2_ligate']; assert all(get_tool_path(t) for t in tools), 'Missing smoke tools'; print(beagle_command(pixi_env_prefix('imputation')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run -e dev pytest -q --basetemp=out/glimpse-smoke tests/test_imputation.py `
            -k "installs_a_chromosome_once or imputes_1x_reads or beagle_preserves_hom_alt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimpse2-win-64
          path: |
            out/conda/win-64/*.conda
            out/conda/win-64/msys2-packages-used.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glimpse2-win-64
          path: glimpse2
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in glimpse2-*) ;; *) echo "Tag must start with glimpse2-" >&2; exit 1 ;; esac
          mkdir -p out
          {
            echo "GLIMPSE2 (odelaneau/GLIMPSE, MIT) built natively for Windows, as a conda package that Pixi installs."
            echo "Built from packaging/glimpse2 at ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "| Package | SHA-256 |"
            echo "| --- | --- |"
            for f in glimpse2/*.conda; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > out/notes.md
          gh release create "$TAG" glimpse2/*.conda glimpse2/msys2-packages-used.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GLIMPSE2 for Windows $TAG" \
            --notes-file out/notes.md --prerelease --latest=false
