name: Native GLIMPSE2

# Builds GLIMPSE2 for the targets Bioconda doesn't ship. Dispatch with a new
# glimpse2-N (Windows) or glimpse2-arm64-N tag to publish the tested packages.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main ]
    paths:
      - packaging/glimpse2/**
      - packaging/glimpse2-arm64/**
      - packaging/windows/**
      - tests/fixtures/imputation_hg002/**
      - tests/test_imputation.py
      - .github/workflows/glimpse2.yml
      - .github/actions/setup-pixi/**
      - .github/actions/compiler-cache/**
      - .github/actions/apt-install/**
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to publish the package under (empty builds only).
        required: false
        default: ""
      target:
        description: Platforms to build and optionally publish.
        type: choice
        options: [win-64, arm64]
        default: win-64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.target == 'win-64') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true

      - name: Install the build packages
        shell: msys2 {0}
        run: |
          mkdir -p out
          grep -hv '^#' packaging/windows/msys2-packages.txt packaging/glimpse2/msys2-packages.txt \
            | xargs pacman -S --needed --noconfirm --noprogressbar
          pacman -S --needed --noconfirm --noprogressbar mingw-w64-ucrt-x86_64-ccache
          pacman -Q > out/msys2-packages-used.txt

      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          install: "false"

      - uses: ./.github/actions/compiler-cache
        with:
          scope: glimpse2
          recipe: ${{ hashFiles('packaging/glimpse2/**', 'packaging/windows/**', '.github/workflows/glimpse2.yml') }}
          compiler: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gcc.exe
          executable: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/ccache.exe

      - name: Build and test the package
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          pixi exec --spec rattler-build==0.77.0 rattler-build build --no-build-id --recipe-dir packaging/glimpse2 `
            --output-dir out/conda --target-platform win-64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out/msys2-packages-used.txt out/conda/win-64/

      # Override the published Windows pin only in this disposable checkout.
      # CI Windows separately tests a fresh install of the pinned release.
      - name: Smoke test native tools on HG002 outside MSYS2
        shell: pwsh
        run: |
          $package = Get-Item out/conda/win-64/glimpse-bio-*.conda
          pixi add --feature imputation --platform win-64 $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi install -e dev -e imputation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run -e dev python -c "from wgsextract_cli.core.dependencies import get_tool_path; from wgsextract_cli.commands.vcf.imputation import beagle_command; from wgsextract_cli.core.pixi_tools import pixi_env_prefix; tools = ['bcftools', 'bgzip', 'tabix', 'GLIMPSE2_chunk', 'GLIMPSE2_split_reference', 'GLIMPSE2_phase', 'GLIMPSE2_ligate']; assert all(get_tool_path(t) for t in tools), 'Missing smoke tools'; print(beagle_command(pixi_env_prefix('imputation')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run -e dev pytest -q --basetemp=out/glimpse-smoke tests/test_imputation.py `
            -k "installs_a_chromosome_once or imputes_1x_reads or beagle_preserves_hom_alt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ./.github/actions/compiler-cache
        with:
          phase: save
          scope: glimpse2
          recipe: ${{ hashFiles('packaging/glimpse2/**', 'packaging/windows/**', '.github/workflows/glimpse2.yml') }}
          compiler: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gcc.exe
          executable: ${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/ccache.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimpse2-win-64
          path: |
            out/conda/win-64/*.conda
            out/conda/win-64/msys2-packages-used.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'win-64' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-native-release
        with:
          tag: ${{ inputs.release_tag }}
          tag-prefix: glimpse2-
          title: GLIMPSE2 for Windows ${{ inputs.release_tag }}
          source: packaging/glimpse2
          artifacts: glimpse2-win-64
          extra-assets: msys2-packages-used.txt
          description: |
            GLIMPSE2 (odelaneau/GLIMPSE, MIT) built natively for Windows, as a conda package that Pixi installs.

  build-arm64:
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.target == 'arm64') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: osx-arm64, runner: macos-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          environments: dev
      - name: Build and test the ARM64 package
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          pixi exec --spec rattler-build==0.77.0 -- rattler-build build \
            --no-build-id -c conda-forge -c bioconda \
            --recipe-dir packaging/glimpse2-arm64 --target-platform "$TARGET" \
            --output-dir out/conda
      - name: Smoke test the candidate package on HG002
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          pixi init --platform "$TARGET" --channel conda-forge --channel bioconda out/candidate
          pixi add --manifest-path out/candidate/pixi.toml "$PWD"/out/conda/"$TARGET"/glimpse-bio-*.conda
          bin="$PWD/out/candidate/.pixi/envs/default/bin"
          case "$TARGET" in
            osx-arm64) test "$(lipo -archs "$bin/GLIMPSE2_phase")" = arm64 ;;
            linux-aarch64) file "$bin/GLIMPSE2_phase" | grep -q 'ARM aarch64' ;;
          esac
          pixi run --locked -e dev env PATH="$bin:$PWD/.pixi/envs/dev/bin:$PATH" \
            python -m pytest -q -o addopts="" --basetemp=out/glimpse-arm64 \
            --junitxml=out/glimpse-arm64.xml tests/test_imputation.py -k imputes_1x_reads
          pixi run --locked -e dev python -c "import xml.etree.ElementTree as ET; s = ET.parse('out/glimpse-arm64.xml').find('testsuite'); assert s is not None and s.get('tests') == '1' and s.get('skipped') == '0'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimpse2-${{ matrix.platform }}
          path: out/conda/${{ matrix.platform }}/glimpse-bio-*.conda
          if-no-files-found: error

  publish-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'arm64' && inputs.release_tag != ''
    needs: build-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-native-release
        with:
          tag: ${{ inputs.release_tag }}
          tag-prefix: glimpse2-arm64-
          title: GLIMPSE2 for ARM64 ${{ inputs.release_tag }}
          source: packaging/glimpse2-arm64
          artifacts: glimpse2-*
          sha256sums: "true"
          description: |
            GLIMPSE2 v2.0.1 (odelaneau/GLIMPSE, MIT) for macOS and Linux ARM64.
            Built with Clang and SIMDe NEON.
