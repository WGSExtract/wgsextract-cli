name: CLI test suite

# The CLI pytest suite on one OS, shared by CI Ubuntu, CI macOS, CI Windows and
# CI Linux ARM64. Those callers keep their own triggers and concurrency; this
# file has none, so the four OS calls in one PR run never cancel each other.
on:
  workflow_call:
    inputs:
      os:
        description: ubuntu, macos, windows or linux-arm64; selects OS-specific steps and names artifacts.
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      environments:
        description: Space-separated Pixi environments to restore.
        type: string
        required: true
      matrix:
        description: Optional duration plan; the first job owns shared setup and cache seeding.
        type: string
      reference:
        description: Install the hs38 reference library the reference-backed tests read.
        type: boolean
        default: false
      skip-generic:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
      tests:
        description: JSON affected test files, or all for safety runs.
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
      main-backstop-candidate:
        description: The Ubuntu caller requested observation collection and failure replay for a full main run.
        type: boolean
        default: false
      queue-dedupe:
        description: >-
          On a main push, skip test files the passing merge group already ran
          at this exact SHA (#1373). Only for OS suites the merge queue runs.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  workflow-smoke:
    if: github.event.pull_request.draft != true && inputs.smoke-only && github.event_name == 'pull_request' && inputs.tests != '[]'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pixi
        with:
          environments: dev
      - name: Exercise changed workflow with smoke tests
        shell: bash
        env:
          TEST_SELECTION: ${{ inputs.tests }}
        run: pixi run python scripts/ci_run_tests.py --selection "$TEST_SELECTION"
  test:
    if: ${{ github.event.pull_request.draft != true && !inputs.smoke-only && inputs.tests != '[]' }}
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix || '[{"label":"all"}]') }}
    runs-on: ${{ inputs.runner }}
    # Per-test contexts use the slower C tracer and need more time.
    timeout-minutes: ${{ inputs.main-backstop-candidate && 80 || inputs.timeout-minutes }}
    steps:
      - name: Verify the full backstop ref
        id: backstop
        if: inputs.os == 'ubuntu' && inputs.main-backstop-candidate
        shell: bash
        run: |
          # Actions expression comparisons ignore case; require the exact branch.
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo "trusted=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ ((inputs.os == 'ubuntu' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) || steps.backstop.outputs.trusted == 'true') && 128 || 1 }}
          persist-credentials: false
      - name: Verify native runner architecture
        if: inputs.os == 'linux-arm64'
        run: test "$(uname -m)" = aarch64
      # Only the lead entry writes shared setup caches.
      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ inputs.environments }}
          writer: ${{ strategy.job-index == 0 }}
      - name: Test installer
        if: inputs.os != 'windows' && strategy.job-index == 0 && inputs.setup-checks
        run: scripts/test_install_sh.sh
      - name: Validate installer arguments
        if: inputs.os == 'windows' && strategy.job-index == 0 && inputs.setup-checks
        shell: cmd
        run: install_windows.bat --dry-run --msys2-root C:\msys64 --skip-pacman-setup
      - name: Verify Tools
        if: inputs.os == 'ubuntu' || inputs.os == 'macos'
        run: chmod +x scripts/verify_tools.sh && pixi run scripts/verify_tools.sh
      - name: Check tools
        if: inputs.os == 'windows' || inputs.os == 'linux-arm64'
        run: pixi run wgsextract deps check
      - name: Check native lineage and VEP entry points
        if: inputs.os == 'linux-arm64'
        run: |
          pixi run --no-install wgsextract lineage y-haplogroup --help > /dev/null
          pixi run -e vep --no-install vep --help > /dev/null
      - name: Import moved modules and collect the full suite
        if: github.event_name == 'pull_request' && strategy.job-index == 0 && inputs.move-modules != '[]'
        shell: bash
        env:
          MOVE_MODULES: ${{ inputs.move-modules }}
        run: pixi run python scripts/ci_check_moves.py --modules "$MOVE_MODULES"
      # UCSC is often unresolvable from runners (#667). Bootstrap keeps a chain
      # already in the library, so restore the newest cached one and keep it only
      # if it has the pinned SHA-256. A verified checksum has one shared key.
      - name: Pinned hg19ToHg38 chain checksum
        if: inputs.reference
        id: chain
        run: pixi run python -c 'import os; from wgsextract_cli.core.microarray.targets import HG19_TO_HG38_CHAIN as c; open(os.environ["GITHUB_OUTPUT"], "a").write(f"sha256={c.sha256}\n")'
      - name: Restore the hg19ToHg38 liftOver chain
        if: inputs.reference
        id: chain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/hg19ToHg38.over.chain.gz
          key: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}
          # Keep the verified fallback during migration from run-id keys.
          restore-keys: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}-
      - name: Keep a restored chain only if it has the pinned SHA-256
        if: inputs.reference
        id: restored
        env:
          CHAIN_SHA256: ${{ steps.chain.outputs.sha256 }}
        run: |
          chain=reference/hg19ToHg38.over.chain.gz
          if [ -f "$chain" ] && echo "$CHAIN_SHA256  $chain" | shasum -a 256 -c --status; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$chain" ]; then
            echo "::warning::Cached $chain failed its SHA-256; downloading it again."
            rm -f "$chain"
          fi
      - name: Configure and Bootstrap Library
        if: inputs.reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run python -c "from wgsextract_cli.core.config import save_config; save_config({'reference_library': 'reference'})"
          pixi run python -m wgsextract_cli.main ref bootstrap --ref reference
      - name: Check the downloaded chain before caching it
        id: downloaded
        if: inputs.reference && steps.restored.outputs.verified != 'true'
        env:
          CHAIN_SHA256: ${{ steps.chain.outputs.sha256 }}
        run: echo "$CHAIN_SHA256  reference/hg19ToHg38.over.chain.gz" | shasum -a 256 -c
      - name: Cache the verified hg19ToHg38 liftOver chain
        if: >-
          inputs.reference && github.ref == 'refs/heads/main' && strategy.job-index == 0 &&
          steps.chain-cache.outputs.cache-hit != 'true' &&
          (steps.restored.outputs.verified == 'true' || steps.downloaded.outcome == 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/hg19ToHg38.over.chain.gz
          key: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}
      - name: Install pinned hs38 release assets
        if: inputs.reference
        shell: bash
        run: |
          bash scripts/ci_hs38.sh install
          # Exercise both indexes against the installed FASTA before pytest can reuse passes.
          pixi run --no-install samtools faidx reference/genomes/hs38.fa.gz chr22:20000001-20000040 > /dev/null
      # This environment is deliberately not restored by setup-pixi above:
      # prove that a fresh install uses the published, SHA-256-pinned package.
      - name: Install pinned imputation tools from scratch
        if: inputs.os == 'windows' && strategy.job-index == 0 && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_imputation.py'))
        shell: pwsh
        run: |
          if (Test-Path .pixi/envs/imputation) {
            Remove-Item -Recurse -Force .pixi/envs/imputation
          }
          pixi install --locked -e imputation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Impute HG002 with the pinned Windows tools (no skips)
        if: inputs.os == 'windows' && strategy.job-index == 0 && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_imputation.py'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          pixi run pytest tests/test_imputation.py -p no:randomly -rs -o addopts="" --basetemp=out/imputation-tmp --junitxml=out/imputation-e2e.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pixi run python -c "import sys, xml.etree.ElementTree as ET; s = ET.parse('out/imputation-e2e.xml').getroot().find('testsuite'); assert s is not None; n = int(s.get('tests', '0')); skipped = int(s.get('skipped', '0')); print(n, 'tests,', skipped, 'skipped'); sys.exit(n == 0 or skipped > 0)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Impute HG002 with the pinned macOS or Linux ARM64 tools (no skips)
        if: (inputs.os == 'macos' || inputs.os == 'linux-arm64') && strategy.job-index == 0 && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_imputation.py'))
        run: |
          mkdir -p out
          pixi install --locked -e imputation
          export PATH="$PWD/.pixi/envs/imputation/bin:$PATH"
          pixi run --locked -e dev pytest tests/test_imputation.py -rs \
            --basetemp=out/imputation-tmp --junitxml=out/imputation-e2e.xml
          pixi run --locked -e dev python -c "import xml.etree.ElementTree as ET; s = ET.parse('out/imputation-e2e.xml').find('testsuite'); assert s is not None and int(s.get('tests', '0')) > 0 and s.get('skipped') == '0'"
      # Test result cache (#915): PRs and merge groups skip test files whose
      # exact dependency hash already passed on main (PRs also on an earlier
      # push of the same PR). A merge group shares only the files it executed;
      # a main push at that exact SHA runs the rest (#1373). The daily Ubuntu run
      # bypasses both skip sources and refreshes the main cache.
      - name: Restore test hashes that passed on main
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-cache/main
          key: test-pass-v1-${{ inputs.os }}-${{ inputs.os == 'linux-arm64' && 'native' || 'all' }}-main-${{ github.run_id }}
          restore-keys: test-pass-v1-${{ inputs.os }}-${{ inputs.os == 'linux-arm64' && 'native' || 'all' }}-main-
      - name: Restore passing hashes from main's second shard
        if: inputs.os != 'linux-arm64' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || matrix.label == 'shard-2')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-cache/main-shard-2
          key: test-pass-v1-${{ inputs.os }}-shard-2-main-${{ github.run_id }}
          restore-keys: test-pass-v1-${{ inputs.os }}-shard-2-main-
      - name: Restore passing hashes from main's third shard
        if: (inputs.os == 'ubuntu' || inputs.os == 'windows') && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || matrix.label == 'shard-3')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-cache/main-shard-3
          key: test-pass-v1-${{ inputs.os }}-shard-3-main-${{ github.run_id }}
          restore-keys: test-pass-v1-${{ inputs.os }}-shard-3-main-
      - name: Find the merge group that already tested this main SHA
        id: merge-group
        if: inputs.queue-dedupe && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: test-pass-queue-${{ inputs.os }}-${{ matrix.label }}
        run: >-
          pixi run -e dev --no-install python scripts/ci_merge_group_passes.py --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA" --artifact "$ARTIFACT" --output out/test-cache/merge-group/passed.json
          --github-output "$GITHUB_OUTPUT"
      - name: Restore test hashes that passed earlier on this PR
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-cache/pr
          key: test-pass-v1-${{ inputs.os }}-${{ matrix.label }}-pr-${{ github.run_id }}
          restore-keys: test-pass-v1-${{ inputs.os }}-${{ matrix.label }}-pr-
      - name: Fetch main's Linux observation artifact
        if: inputs.os == 'ubuntu' && strategy.job-total == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_fetch
          --repository "$GITHUB_REPOSITORY" --base "${QUEUE_BASE:-HEAD^1}"
          --output out/test-impact-map/linux.json.gz
      - name: Run Tests
        id: regular-pytest
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRUSTED_FULL_MAIN: ${{ steps.backstop.outputs.trusted }}
          TEST_SELECTION: ${{ github.event_name == 'pull_request' && inputs.tests || 'all' }}
          SHARD_SELECTION: ${{ matrix.selection }}
          SHARD_ESTIMATE: ${{ matrix.seconds }}
          SHARD_GATE: ${{ matrix.gate }}
          SHARD_LABEL: ${{ matrix.label }}
          SHARD_COUNT: ${{ strategy.job-total }}
          OS: ${{ inputs.os }}
          QUEUE_DEDUPE: ${{ inputs.queue-dedupe }}
          MERGE_GROUP_RUN: ${{ steps.merge-group.outcome == 'success' && steps.merge-group.outputs.run || '' }}
          SYMBOL_DISABLED: ${{ vars.CI_DISABLE_SYMBOL_SELECTION }}
          # Ubuntu x64 alone runs the reviewed OS-independent tests.
          SKIP_INDEPENDENT: ${{ inputs.os != 'ubuntu' || inputs.skip-generic }}
        # -n logical overrides test-ci's -n auto: with psutil installed, auto
        # counts physical cores, two of the four vCPUs on hosted x64 runners (#1305).
        run: |
          args=(-n logical)
          if [ "$SKIP_INDEPENDENT" = true ]; then args+=(--ci-skip-independent); fi
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            args+=(--cov=wgsextract_cli --cov-report=xml:out/coverage.xml)
          fi
          if [ "$TRUSTED_FULL_MAIN" = true ]; then
            args+=(--cov-context=test --cov-config=.github/coverage-impact.ini)
          fi
          # A module earns the same hash whichever duration bin it lands in.
          cache=(--cache-job "os=$OS tier=all shard=all skip-independent=$SKIP_INDEPENDENT")
          main_cache=(--cache-read main=out/test-cache/main/passed.json)
          for index in 2 3; do
            if [ -f "out/test-cache/main-shard-$index/passed.json" ]; then
              main_cache+=(--cache-read "main-shard-$index=out/test-cache/main-shard-$index/passed.json")
            fi
          done
          if [ "$EVENT" = pull_request ]; then
            cache+=("${main_cache[@]}")
            cache+=(--cache-read pr=out/test-cache/pr/passed.json)
            cache+=(--cache-record out/test-cache/pr/passed.json --summary "$GITHUB_STEP_SUMMARY")
          elif [ "$EVENT" = merge_group ]; then
            cache+=("${main_cache[@]}" --summary "$GITHUB_STEP_SUMMARY")
            if [ "$QUEUE_DEDUPE" = true ]; then
              cache+=(--record-executed out/test-cache/queue/passed.json out/pytest.xml)
            fi
          elif [ "$REF" = refs/heads/main ]; then
            case "$SHARD_LABEL" in
              shard-*) cache+=(--cache-record "out/test-cache/main-$SHARD_LABEL/passed.json");;
              *) cache+=(--cache-record out/test-cache/main/passed.json);;
            esac
            # Never main's own manifest: only what the queue ran at this SHA.
            if [ "$EVENT" = push ] && [ -n "$MERGE_GROUP_RUN" ]; then
              cache+=(--cache-read "merge-group-$MERGE_GROUP_RUN=out/test-cache/merge-group/passed.json")
              cache+=(--summary "$GITHUB_STEP_SUMMARY")
            fi
          else
            cache=()
          fi
          # Symbol selection still gates PRs. On main it could omit files the
          # queue skipped using older caches, so use only the exact-SHA complement.
          if [ -n "$SHARD_SELECTION" ]; then
            TEST_SELECTION="$SHARD_SELECTION"
            if [ "$SHARD_GATE" = universal-full ]; then cache=(); fi
            if [ -n "$SHARD_GATE" ] && [ "$SHARD_COUNT" = 1 ]; then
              mkdir -p out
              jq -n --arg mode "$SHARD_GATE" --arg selection "$TEST_SELECTION" \
                '{mode:$mode, selection:($selection | if . == "all" then . else fromjson end)}' \
                >out/test-selection-gate.json
            fi
          elif [ "$OS" = ubuntu ] && [ "$EVENT" = pull_request ]; then
            flags=()
            if [ "$SYMBOL_DISABLED" = true ]; then flags+=(--disabled); fi
            if timeout 90 pixi run -e dev --no-install python -m scripts.ci_impact_gate \
              --event "$EVENT" --base HEAD^1 --legacy "$TEST_SELECTION" \
              --observations out/test-impact-map/linux.json.gz \
              --output out/test-selection-gate.json "${flags[@]}" \
              && selected=$(jq -ce '.selection | if type=="string" and .=="all" or type=="array" then . else error("invalid selector output") end' out/test-selection-gate.json); then
              if [ "$selected" = '"all"' ]; then TEST_SELECTION=all; else TEST_SELECTION="$selected"; fi
              mode=$(jq -r .mode out/test-selection-gate.json)
              if [ "$mode" = universal-full ]; then
                cache=()
              elif [ "$mode" = symbol ]; then
                echo "Linux symbol gate mode: symbol."
              else
                echo "::warning::Linux symbol gate did not activate: $mode; retained current selection."
              fi
            else
              rm -f out/test-selection-gate.json
              echo '::warning::Symbol selector unavailable; retaining legacy selection.'
            fi
          fi
          if [ "${#cache[@]}" -gt 0 ]; then cache+=(--scope out/test-scope.json); fi
          start=$SECONDS
          status=0
          pixi run python scripts/ci_run_tests.py --selection "$TEST_SELECTION" "${cache[@]}" -- "${args[@]}" || status=$?
          {
            echo '### Pytest shard timing'
            if [ -n "$SHARD_ESTIMATE" ]; then
              echo "Estimated runner time before cache skips: ${SHARD_ESTIMATE}s."
            else
              echo 'No duration estimate available for this lane.'
            fi
            echo "Actual selection and pytest time: $((SECONDS - start))s."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SHARD_SELECTION" ]; then
            mkdir -p out
            printf '%s\n' "$status" > out/shard-exit-status
            printf '%s\n' "$SHARD_COUNT" > out/shard-count
          fi
          exit "$status"
      - name: Share the test files this merge group ran with the main push
        if: inputs.queue-dedupe && github.event_name == 'merge_group' && hashFiles('out/test-cache/queue/passed.json') != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-pass-queue-${{ inputs.os }}-${{ matrix.label }}
          path: out/test-cache/queue/passed.json
          retention-days: 7
          # A rerun attempt replaces the earlier attempt's manifest.
          overwrite: true
      - name: Save test hashes that passed
        if: hashFiles('out/test-cache/main*.updated', 'out/test-cache/pr.updated') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-cache/${{ github.event_name == 'pull_request' && 'pr' || (startsWith(matrix.label, 'shard-') && format('main-{0}', matrix.label)) || 'main' }}
          key: test-pass-v1-${{ inputs.os }}-${{ matrix.label }}-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The app's bundle commands must still parse with this CLI (#538); GUI CI
      # checks the bundle side, this catches a CLI flag dropped or renamed.
      - name: Check the app's bundle commands parse with this CLI
        if: inputs.os == 'ubuntu' && strategy.job-index == 0 && (inputs.setup-checks || inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_cli_parser.py'))
        working-directory: gui
        run: pixi run python -m unittest discover -s tests/wgsextract
      - name: Annotate with vep-rs end to end (no skips)
        if: inputs.os == 'windows' && strategy.job-index == 0 && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_vep_rs.py'))
        shell: pwsh
        run: |
          pixi run python -c "from wgsextract_cli.core.dependencies import get_tool_path as g; assert g('vep-rs') and g('vep-cache-builder'), 'vep-rs environment missing'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pixi run pytest tests/test_vep_rs.py -p no:randomly -rs -o addopts="" --junitxml=out/vep-rs-e2e.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pixi run python -c "import sys, xml.etree.ElementTree as ET; s = ET.parse('out/vep-rs-e2e.xml').getroot().find('testsuite'); n = int(s.get('skipped')); print(s.get('tests'), 'tests,', n, 'skipped'); sys.exit(n > 0)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Each extract, call and annotate command run end to end on generated chrM
      # and whole-genome data; about 30 s, no downloads.
      - name: Run end-to-end tests on generated data
        if: strategy.job-index == 0 && (inputs.tests == 'all' || inputs.tests == '' || contains(inputs.tests, 'tests/test_e2e_'))
        run: pixi run test-e2e-fake --junitxml=out/e2e-fake.xml
      - name: Publish test timings and non-gating coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ inputs.os }}-${{ matrix.label }}
          overwrite: true
          path: |
            out/coverage.xml
            out/pytest.xml
            out/imputation-e2e.xml
            out/vep-rs-e2e.xml
            out/e2e-fake.xml
            out/pure-move-collection.log
            out/test-scope.json
            out/shard-exit-status
            out/shard-count
      - name: Export Linux test observations
        id: impact-map
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.regular-pytest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_observations
          --coverage-file out/.coverage --junit out/pytest.xml
          --output out/test-impact-map/linux.json.gz
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Publish main's Linux observation artifact
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.impact-map.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-observations-${{ github.run_attempt }}
          path: out/test-impact-map/linux.json.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Export advisory Linux line observations
        id: line-map
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.impact-map.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_lines
          --coverage-file out/.coverage --output out/test-impact-map/lines.json.gz
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Save main's advisory Linux line map
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.line-map.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-impact-map/lines.json.gz
          key: ci-impact-lines-v1-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive the advisory Linux line map
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.line-map.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-line-impact-map
          path: out/test-impact-map/lines.json.gz
          compression-level: 0 # Already gzipped.
          retention-days: 7
          overwrite: true
      - name: Restore main's advisory Linux line map
        if: ${{ !cancelled() && inputs.os == 'ubuntu' && github.event_name == 'pull_request' && strategy.job-total == 1 }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-impact-map/lines.json.gz
          key: ci-impact-lines-v1-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-impact-lines-v1-linux-x64-
      - name: Compare shadow selection with regular Linux pytest
        if: ${{ !cancelled() && inputs.os == 'ubuntu' && github.event_name == 'pull_request' && strategy.job-total == 1 }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          TEST_SELECTION: ${{ inputs.tests }}
          TEST_OUTCOME: ${{ steps.regular-pytest.outcome }}
        run: |
          pixi run -e dev --no-install python -m scripts.ci_impact_shadow \
            --observations out/test-impact-map/linux.json.gz --junit out/pytest.xml \
            --line-map out/test-impact-map/lines.json.gz \
            --output out/test-selection-shadow.json --summary "$GITHUB_STEP_SUMMARY" \
            --gate-decision out/test-selection-gate.json \
            --selection "$TEST_SELECTION" --outcome "$TEST_OUTCOME" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            || echo '### Linux test selection shadow unavailable (report generation failed)' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload advisory Linux selection and outcome receipt
        if: ${{ !cancelled() && inputs.os == 'ubuntu' && github.event_name == 'pull_request' && strategy.job-total == 1 }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection-shadow
          overwrite: true
          path: out/test-selection-shadow.json
          if-no-files-found: ignore
      - name: Attribute failed daily Linux tests
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.regular-pytest.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_backstop
          --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID"
          --junit out/pytest.xml --report out/selector-misses/report.json
          --witnesses out/selector-misses/witnesses.jsonl
      - name: Upload Linux selector miss receipts
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.regular-pytest.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-selector-misses
          path: out/selector-misses/report.json
          if-no-files-found: ignore
      - name: Score advisory Linux line recall
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.regular-pytest.outcome == 'failure' && hashFiles('out/selector-misses/witnesses.jsonl') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_backstop
          --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID"
          --witnesses out/selector-misses/witnesses.jsonl
          --report out/selector-line-recall/report.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload advisory Linux line recall
        if: ${{ !cancelled() && steps.backstop.outputs.trusted == 'true' && steps.regular-pytest.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-selector-line-recall
          path: out/selector-line-recall/report.json
          if-no-files-found: ignore
          overwrite: true

  selection-shadow:
    # This is the same advisory receipt as the single-job path, but only
    # publish it after reading all of the sharded Linux pytest results.
    needs: test
    if: ${{ !cancelled() && github.event.pull_request.draft != true && inputs.os == 'ubuntu' && github.event_name == 'pull_request' && fromJSON(inputs.matrix || '[]')[1].label == 'shard-2' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 128
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: dev
          writer: "false"
      - name: Fetch trusted Linux observations for the shard receipt
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run -e dev --no-install python -m scripts.ci_impact_fetch
          --repository "$GITHUB_REPOSITORY" --base HEAD^1
          --output out/test-impact-map/linux.json.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-ubuntu-*
          path: out/shard-reports
      - name: Restore main's advisory Linux line map
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/test-impact-map/lines.json.gz
          key: ci-impact-lines-v1-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-impact-lines-v1-linux-x64-
      - name: Publish one Linux selection receipt from every shard
        env:
          MATRIX: ${{ inputs.matrix }}
          TEST_SELECTION: ${{ inputs.tests }}
        run: |
          python3 -m scripts.ci_shard_receipt --matrix "$MATRIX" --reports out/shard-reports --output out/shard-receipt
          pixi run -e dev --no-install python -m scripts.ci_impact_shadow \
            --observations out/test-impact-map/linux.json.gz --junit out/shard-receipt/pytest.xml \
            --line-map out/test-impact-map/lines.json.gz \
            --output out/test-selection-shadow.json --summary "$GITHUB_STEP_SUMMARY" \
            --gate-decision out/shard-receipt/gate.json \
            --selection "$TEST_SELECTION" --outcome "$(cat out/shard-receipt/outcome)" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection-shadow
          overwrite: true
          path: out/test-selection-shadow.json
          if-no-files-found: ignore
