name: Release

# A release starts in any of these ways:
# - Merging a release PR that changes the version in pyproject.toml. This
#   workflow then creates the vX.Y.Z tag itself, so nobody needs to push a
#   tag (agent sessions often can't).
# - Running this workflow on main, which retries the current version's
#   release if it failed (before or after its tag was created).
# The tag must match the version in pyproject.toml, pixi.toml and the
# package. The tag pins every preflight job, and all must pass before a
# draft becomes public. If the tagged commit has
# docs/release-notes/vX.Y.Z.md, the release is published with those notes
# and becomes the latest unless a newer version already is (install.sh
# installs the latest published release); otherwise it's left as a draft with
# generated notes to edit and publish.
#
# The same release carries the WGS Extract desktop app (gui/). Distribution
# produces the signed installers and updater feed; only the validated run's
# assets are uploaded to the draft.

on:
  push:
    branches: [ main ]
    paths: [ "pyproject.toml" ]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time, so two runs can't race to tag or publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version_of() {
            python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          }
          # The commit a tag points at, or nothing if there is no such tag.
          tag_commit() {
            local ref
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" \
              --jq '.object.type + " " + .object.sha' 2>/dev/null) || return 0
            if [ "${ref%% *}" = tag ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .object.sha
            else
              echo "${ref#* }"
            fi
          }
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Dispatch Release from main."
            exit 1
          fi
          tag="v$(version_of < pyproject.toml)"
          # pyproject.toml changes for other reasons too; only a push that
          # changes the version is a release.
          if [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] &&
             git fetch -q --depth=1 origin "$BEFORE" &&
             [ "v$(git show "$BEFORE:pyproject.toml" | version_of)" = "$tag" ]; then
            echo "The version is still ${tag#v}; nothing to release."
            exit 0
          fi
          existing=$(tag_commit "$tag")
          if [ -z "$existing" ]; then
            sha=$GITHUB_SHA create_tag=true
          else
            # Retry the exact tagged commit after an interrupted publication.
            sha=$existing create_tag=false
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          echo "Releasing $tag from $sha"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A retry may verify an unpublished older tag that predates the current CI
      # helpers, so install Pixi from this run's commit before checking it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi
        with:
          install: "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Tag matches the package version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 - "$TAG" <<'EOF'
          import re, sys, tomllib
          tag = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)["project"]["version"]
          with open("pixi.toml", "rb") as f:
              pixi = tomllib.load(f)["workspace"]["version"]
          with open("src/wgsextract_cli/__init__.py") as f:
              package = re.search(r'__version__ = "([^"]+)"', f.read())[1]
          with open("gui/examples/WGSExtract/scripts/wgsextract-release-tag.txt") as f:
              app_pin = f.read().strip()[1:]
          versions = {"pyproject.toml": pyproject, "pixi.toml": pixi,
                      "src/wgsextract_cli/__init__.py": package,
                      "gui/examples/WGSExtract/scripts/wgsextract-release-tag.txt": app_pin}
          wrong = {path: v for path, v in versions.items() if f"v{v}" != tag}
          if wrong:
              sys.exit(f"Tag {tag} doesn't match: {wrong}")
          print(f"{tag} matches {', '.join(versions)}")
          EOF
      - name: Install the tag's locked environments
        run: pixi install --locked -e default -e dev
      - name: Lint and type check
        run: |
          pixi run lint
          pixi run typecheck
      - name: Tests
        run: pixi run test
      - name: Build and smoke test the package
        run: pixi run package-smoke
      # The shared action's post step reloads it from the workspace.
      - name: Restore this run's CI helpers for post-job steps
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  # The "Protect release tags" ruleset doesn't let the workflow token create
  # v* tags, so the tag is pushed with a deploy key the ruleset lets through.
  # The key is a secret of the release-tag environment, which only main can
  # use, so no other job or branch sees it.
  tag:
    needs: [ resolve, verify ]
    if: needs.resolve.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
      - name: Push the tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        # An existing tag on this commit is fine, annotated or not.
        run: |
          if ! git push origin "$SHA:refs/tags/$TAG"; then
            current=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
            [ -n "$current" ] || current=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
            if [ "$current" != "$SHA" ]; then
              echo "::error::$TAG already points at $current, not $SHA."
              exit 1
            fi
          fi

  preflight:
    needs: [resolve, verify, tag]
    # The tag job is skipped when the tag already exists.
    if: ${{ !cancelled() && needs.verify.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.tag.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    outputs:
      gui_run: ${{ steps.gates.outputs.gui_run }}
      gui_artifact: ${{ steps.gates.outputs.gui_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch release gates and require success on the tagged commit
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/ci_release_gate.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --output "$GITHUB_OUTPUT"

  publish:
    needs: [resolve, preflight]
    # A retry can skip the upstream tag job; still require actual green preflight.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: run-helpers
          persist-credentials: false
          sparse-checkout: scripts/ci_release_latest.py
          sparse-checkout-cone-mode: false
      - name: Download the validated distribution's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.gui_run }}
          artifact-ids: ${{ needs.preflight.outputs.gui_artifact }}
          merge-multiple: true
          path: release-assets
      - name: Stage the validated draft and its app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          test -s release-assets/latest.json
          case "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" in
            false) echo "::error::$TAG is already published."; exit 1 ;;
            true) echo "Reusing the $TAG draft." ;;
            *)
              notes=(--generate-notes)
              if [ -f "docs/release-notes/$TAG.md" ]; then
                notes=(--notes-file "docs/release-notes/$TAG.md")
              fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
                --draft --title "WGS Extract $TAG" "${notes[@]}"
              ;;
          esac
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the validated draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ ! -f "docs/release-notes/$TAG.md" ]; then
            echo "::notice::Preflight passed. Edit the generated notes before publishing the draft."
            exit 0
          fi
          # Never promote an older candidate ahead of a newer release (#1229).
          make_latest=$(python3 run-helpers/scripts/ci_release_latest.py --repo "$GITHUB_REPOSITORY" "$TAG")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
