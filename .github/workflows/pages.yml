name: GitHub Pages

# The CLI's site at the root, the desktop app's site (gui/site_src) under
# app/: https://wgsextract.github.io/wgsextract-cli/app/, and the UI redesign
# mockups (gui/mockups) under app/mockups/.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "site_src/**"
      - "scripts/build_site.py"
      - "gui/site_src/**"
      - "gui/scripts/build_site.py"
      - "gui/scripts/site_*.py"
      - "gui/scripts/validate_site_sources.py"
      - "gui/mockups/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Build the app's site under app/
        run: |
          python3 gui/scripts/validate_site_sources.py
          python3 gui/scripts/build_site.py
          rm -rf site/app
          cp -R gui/site site/app
          rm -f site/app/.nojekyll

      # Static files as they are. Without serve.py, notes stay in the browser;
      # _pages.json lists the committed feedback files for the pages to show,
      # and version.js the commit, shown in the mockups index footer.
      - name: Add the UI mockups under app/mockups/
        run: |
          rm -rf site/app/mockups
          cp -R gui/mockups site/app/mockups
          find site/app/mockups -name __pycache__ -prune -exec rm -rf {} +
          printf 'window.WGSM_VERSION = { source: "pages", sha: "%s", date: "%s" };\n' \
            "$GITHUB_SHA" "$(git log -1 --format=%cI "$GITHUB_SHA")" > site/app/mockups/shared/version.js
          python3 -c 'import json, pathlib; d = pathlib.Path("site/app/mockups/feedback"); d.mkdir(exist_ok=True); (d / "_pages.json").write_text(json.dumps(sorted(p.stem for p in d.glob("*.json") if not p.stem.startswith("_"))))'

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
