name: GitHub Pages

# The CLI's site at the root, the desktop app's site (gui/site_src) under
# app/: https://wgsextract.github.io/wgsextract-cli/app/, and the UI redesign
# mockups (gui/mockups) under app/mockups/, with previews of the mockups/*
# branches under app/mockups/preview/<name>/. mockup_previews.yml starts this
# workflow on main when such a branch is pushed or deleted.

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "site/**"
      - "site_src/**"
      - "src/wgsextract_cli/**"
      - "docs/data/configuration-guide.md"
      - "pyproject.toml"
      - "scripts/build_site.py"
      - "scripts/build_docs_html.py"
      - "scripts/validate_site_sources.py"
      - "scripts/site_references.py"
      - "scripts/gen_api_docs.py"
      - "scripts/gen_config_docs.py"
      - "gui/README.md"
      - "gui/docs/**"
      - "gui/devdocs/**"
      - "gui/site_src/**"
      - "gui/site/assets/**"
      - "gui/scripts/build_site.py"
      - "gui/scripts/site_*.py"
      - "gui/scripts/validate_site_sources.py"
      - "gui/mockups/**"
      - "scripts/build_mockup_previews.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install site build dependencies
        run: python -m pip install --quiet -e . 'markdown-it-py>=3,<5'

      - name: Build static site
        run: python scripts/build_site.py

      - name: Build the app's site under app/
        run: |
          python3 gui/scripts/validate_site_sources.py
          python3 gui/scripts/build_site.py
          rm -rf site/app
          cp -R gui/site site/app
          rm -f site/app/.nojekyll

      - name: Render Markdown documentation to HTML
        run: python3 scripts/build_docs_html.py

      # Static files as they are. Without serve.py, notes stay in the browser;
      # _pages.json lists the committed feedback files for the pages to show,
      # and version.js the commit, shown in the mockups index footer.
      - name: Add the UI mockups under app/mockups/
        run: |
          rm -rf site/app/mockups
          cp -R gui/mockups site/app/mockups
          find site/app/mockups -name __pycache__ -prune -exec rm -rf {} +
          printf 'window.WGSM_VERSION = { source: "pages", sha: "%s", date: "%s" };\n' \
            "$GITHUB_SHA" "$(git log -1 --format=%cI "$GITHUB_SHA")" > site/app/mockups/shared/version.js
          python3 -c 'import json, pathlib; d = pathlib.Path("site/app/mockups/feedback"); d.mkdir(exist_ok=True); (d / "_pages.json").write_text(json.dumps(sorted(p.stem for p in d.glob("*.json") if not p.stem.startswith("_"))))'

      # Static files only from each branch (read from git archive, never run),
      # with code from main; this repository's branches only, never forks.
      - name: Add previews of mockups/* branches under app/mockups/preview/
        run: python3 scripts/build_mockup_previews.py --out site/app/mockups/preview

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Mirror the rendered CLI and app HTML into WGSExtract/wgsextract.github.io
  # under wgsextract-cli/ (CLI docs) and wgsextract-cli/app/ (app docs), so
  # wgse.bio and wgsextract.github.io can serve them directly without project
  # Pages once project Pages on this repository is turned off.
  sync-main-site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main-site
    permissions:
      contents: read
    steps:
      - name: Is the deploy key set?
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.MAIN_SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::MAIN_SITE_DEPLOY_KEY isn't set in the main-site environment, so wgsextract.github.io/wgsextract-cli was not updated."
            exit 0
          fi
          echo "set=true" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.set == 'true'
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - if: steps.key.outputs.set == 'true'
        name: Checkout wgsextract.github.io
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WGSExtract/wgsextract.github.io
          path: main-site
          ssh-key: ${{ secrets.MAIN_SITE_DEPLOY_KEY }}

      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - if: steps.key.outputs.set == 'true'
        name: Build and sync HTML into wgsextract-cli/
        run: |
          cd repo
          python -m pip install --quiet -e . 'markdown-it-py>=3,<5'
          python scripts/build_site.py
          python3 gui/scripts/validate_site_sources.py
          python3 gui/scripts/build_site.py
          rm -rf site/app
          cp -R gui/site site/app
          rm -f site/app/.nojekyll
          python3 scripts/build_docs_html.py
          cd ..
          mkdir -p main-site/wgsextract-cli
          rsync -a --delete --exclude='.nojekyll' --exclude='/app/mockups/' repo/site/ main-site/wgsextract-cli/
          cd main-site
          git add -A wgsextract-cli
          if git diff --cached --quiet; then
            echo "No rendered documentation changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "docs: sync rendered CLI and app HTML from wgsextract-cli"
          git push origin HEAD
