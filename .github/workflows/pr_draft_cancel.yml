name: Cancel redrafted Install Lab checks

on:
  pull_request:
    types: [ready_for_review, converted_to_draft]

permissions: {}

# The area workflow's label group is intentionally separate from code checks.
# A second runner-free event cancels that group without labels cancelling code.
concurrency:
  group: pr-area-${{ github.ref }}-label-run-install-lab
  cancel-in-progress: true

jobs:
  no-runner:
    if: ${{ github.event.pull_request.draft != true && false }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"
