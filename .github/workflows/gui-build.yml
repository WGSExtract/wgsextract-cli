name: GUI build

# Builds the WGS Extract desktop app (gui/) installers at a commit and uploads
# them as tauri-* artifacts of the calling run. gui-distribution.yml calls it
# with the signing secrets (signed for a release); Install Lab calls it without
# them, for an unsigned app built from the tree it tests (#625).
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        required: true
        type: string
      tag:
        description: The vX.Y.Z release this build is for (empty for a test build).
        required: false
        type: string
        default: ""
      targets:
        description: A JSON list of the installers to build, by artifact name.
        required: false
        type: string
        default: '["tauri-linux", "tauri-macos-arm64", "tauri-macos-x64", "tauri-windows"]'

permissions:
  contents: read

jobs:
  tauri:
    name: Tauri (${{ matrix.artifact_name }})
    runs-on: ${{ fromJSON('{"tauri-linux":"ubuntu-24.04","tauri-macos-arm64":"macos-latest","tauri-macos-x64":"macos-15-intel","tauri-windows":"windows-latest"}')[matrix.artifact_name] }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        artifact_name: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        working-directory: gui
    env:
      PYTHON: python3
      RELEASE_TAG: ${{ inputs.tag }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
      TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PACKAGE_REQUIRE_MACOS_SIGNING: ${{ inputs.tag != '' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # This run's CI helpers, which an older ref being rebuilt may predate.
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gui/out/ci-helpers
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Configure release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: echo "PACKAGE_APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Setup Node
        timeout-minutes: 10
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Configure shared npm downloads
        shell: bash
        run: npm config set cache "$GITHUB_WORKSPACE/.npm"
      - name: Restore npm downloads with this run's helpers
        uses: ./gui/out/ci-helpers/.github/actions/download-cache
        with:
          path: .npm
          key: npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gui/app/package-lock.json') }}

      # The hosted runners ship rustup; Tauri builds with the current stable.
      - name: Setup Rust
        timeout-minutes: 10
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install Linux system dependencies
        if: matrix.artifact_name == 'tauri-linux'
        timeout-minutes: 30
        uses: ./gui/out/ci-helpers/.github/actions/apt-install
        with:
          cache: ${{ inputs.tag == '' }}
          packages: >-
            libgtk-3-dev
            libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            patchelf
            rpm
            zstd

      # Tauri signs and notarizes the macOS app when these variables are set:
      # https://v2.tauri.app/distribute/sign/macos/
      - name: Configure macOS signing and notarization
        if: startsWith(matrix.artifact_name, 'tauri-macos')
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$PACKAGE_REQUIRE_MACOS_SIGNING" ]; then
              echo "::error::Releases need APPLE_CERTIFICATE_P12 and APPLE_SIGNING_IDENTITY secrets."
              exit 1
            fi
            echo "::warning::Apple signing secrets are not configured; the macOS app will be ad-hoc signed (not notarized)."
            # Ad hoc ("-"): Tauri seals the whole bundle, so codesign --verify
            # --strict accepts it while Gatekeeper still refuses it. Without it,
            # only the linker's signature on the binary remains, which fails
            # that check ("code has no resources but signature indicates they
            # must be present").
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          # Preferred: an App Store Connect API key (no Apple ID password or 2FA).
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          elif [ -n "$PACKAGE_REQUIRE_MACOS_SIGNING" ]; then
            echo "::error::Releases need notarization credentials (App Store Connect API key or Apple ID)."
            exit 1
          fi

      # The crates Cargo.lock names, checked against its hashes when used. Not
      # the build tree: it is large, and a release builds from scratch.
      - name: Cache Cargo downloads
        if: env.RELEASE_TAG == ''
        uses: ./gui/out/ci-helpers/.github/actions/download-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gui/app/web/packagers/tauri/Cargo.lock') }}

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci --prefix app

      - name: Package Tauri app
        run: python3 tools/tasks.py package tauri

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: gui/out/release/tauri/*
          if-no-files-found: error
