name: CI macOS

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    uses: ./.github/workflows/os_tests.yml
    with:
      os: macos
      runner: macos-latest
      timeout-minutes: 90
      environments: default dev vep-rs
      reference: true
