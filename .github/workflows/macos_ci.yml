name: CI macOS

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      smoke-only:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-macos-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly_guard.yml
    with:
      workflow: macos_ci.yml
  test-macos:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result != 'success' || needs.nightly.outputs.skip != 'true') && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: macos
      runner: macos-latest
      timeout-minutes: 59
      environments: default dev vep-rs
      reference: true
      tests: ${{ inputs.tests || 'all' }}
      smoke-only: ${{ inputs.smoke-only == true }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}
