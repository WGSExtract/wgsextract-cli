name: CI macOS

# pr_ci.yml selects PRs; main pushes and nightly runs retain the full matrix.
on:
  push:
    branches: [ main ]
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}

jobs:
  test-macos:
    uses: ./.github/workflows/os_tests.yml
    with:
      os: macos
      runner: macos-latest
      timeout-minutes: 90
      environments: default dev vep-rs
      reference: true
