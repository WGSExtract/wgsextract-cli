name: CI macOS

# pr_ci.yml selects PRs; nightly is the full backstop.
on:
  workflow_call:
    inputs:
      tests:
        type: string
        default: all
      matrix:
        type: string
      smoke-only:
        type: boolean
        default: false
      setup-checks:
        type: boolean
        default: true
      move-modules:
        type: string
        default: "[]"
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-macos-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly_guard.yml
    with:
      shard-os: macos
  test-macos:
    needs: nightly
    if: ${{ !cancelled() && inputs.tests != '[]' }}
    uses: ./.github/workflows/os_tests.yml
    with:
      os: macos
      runner: macos-latest
      timeout-minutes: 59
      environments: default dev vep-rs fastvep
      reference: true
      tests: ${{ inputs.tests || 'all' }}
      matrix: ${{ inputs.matrix || needs.nightly.outputs.matrix }}
      smoke-only: ${{ inputs.smoke-only == true }}
      setup-checks: ${{ github.event_name != 'pull_request' || inputs.setup-checks }}
      move-modules: ${{ inputs.move-modules || '[]' }}
