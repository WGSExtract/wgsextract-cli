name: CI macOS

# The desktop app (gui/) has its own CI (gui-*.yml); app-only changes skip this.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - gui/**
      - .github/workflows/gui-*.yml
  pull_request:
    branches: [ main ]
    paths-ignore:
      - gui/**
      - .github/workflows/gui-*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          environments: >-
            default
            dev
      - name: Test installer
        run: scripts/test_install_sh.sh
      - name: Verify Tools
        run: chmod +x scripts/verify_tools.sh && pixi run scripts/verify_tools.sh
      # UCSC is often unresolvable from runners (#667). Bootstrap keeps a chain
      # already in the library, so restore it, checked against the pinned SHA-256.
      - name: Pinned hg19ToHg38 chain checksum
        id: chain
        run: pixi run python -c 'import os; from wgsextract_cli.core.microarray_targets import HG19_TO_HG38_CHAIN as c; open(os.environ["GITHUB_OUTPUT"], "a").write(f"sha256={c.sha256}\n")'
      - name: Cache the hg19ToHg38 liftOver chain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/hg19ToHg38.over.chain.gz
          key: ucsc-hg19ToHg38-${{ steps.chain.outputs.sha256 }}
      - name: Drop a cached chain that fails its checksum
        env:
          CHAIN_SHA256: ${{ steps.chain.outputs.sha256 }}
        run: |
          chain=reference/hg19ToHg38.over.chain.gz
          if [ -f "$chain" ] && ! echo "$CHAIN_SHA256  $chain" | shasum -a 256 -c --status; then
            echo "::warning::Cached $chain failed its SHA-256; downloading it again."
            rm -f "$chain"
          fi
      - name: Configure and Bootstrap Library
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run python -c "from wgsextract_cli.core.config import save_config; save_config({'reference_library': 'reference'})"
          pixi run python -m wgsextract_cli.main ref bootstrap --ref reference
      - name: Cache public hs38 reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/genomes
          key: hs38-v1-${{ hashFiles('src/wgsextract_cli/assets/reference/seed_genomes.csv', 'src/wgsextract_cli/core/ref_library/catalog.py') }}
      - name: Install Reference Genome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run python -m wgsextract_cli.main ref library --install hs38 --ref reference
      - name: Build and Smoke Test Package
        run: pixi run package-smoke
      - name: Run Benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run wgsextract benchmark --dataset real --profile smoke
          echo "Benchmark timing is published in this job summary."
      - name: Run Tests
        run: pixi run test-ci
      - name: Publish test timings and non-gating coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-macos
          path: |
            out/coverage.xml
            out/pytest.xml
      # Each extract, call and annotate command run end to end on generated chrM
      # and whole-genome data; about 30 s, no downloads.
      - name: Run end-to-end tests on generated data
        run: pixi run test-e2e-fake
