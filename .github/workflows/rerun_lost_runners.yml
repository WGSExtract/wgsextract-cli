name: Rerun Lost Runners

# A hosted runner sometimes dies mid-job ("The hosted runner lost communication
# with the server"), most often on Windows, and Ubuntu's package mirrors are
# sometimes unreachable from the runners (.github/actions/apt-install marks
# that "Upstream package mirror unreachable"). Neither says anything about the
# change, so rerun the failed jobs: once for a lost runner, and up to twice,
# 10 minutes apart, for a mirror outage. A failure the run itself caused is
# left alone.
on:
  workflow_run:
    workflows:
      - CI Ubuntu
      - CI macOS
      - CI Windows
      - Install Lab
      - GUI CI
      - GUI Tauri installer
      - GUI developer setup
      - GUI distribution
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt <= 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rerun if a runner was lost or the package mirrors were down
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --paginate -q '.jobs[] | select(.conclusion == "failure") | .id')
          outage=
          for job in $jobs; do
            messages=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" --paginate -q '.[].message')
            if [ "$ATTEMPT" -eq 1 ] && grep -qE "lost communication with the server|runner has received a shutdown signal" <<< "$messages"; then
              echo "Job $job lost its runner; rerunning the failed jobs of run $RUN_ID."
              gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            if grep -q "Upstream package mirror unreachable" <<< "$messages"; then outage=$job; fi
          done
          if [ -n "$outage" ]; then
            echo "Job $outage couldn't reach the package mirrors; rerunning the failed jobs of run $RUN_ID in 10 minutes."
            sleep 600
            # A newer run (a push meanwhile) would be cancelled by this one's
            # rerun, in workflows that cancel superseded runs. Forks reuse
            # branch names (main, patch-1), so match the head repository too.
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs" -X GET \
              -f branch="$BRANCH" -f event="$EVENT" -f per_page=100 \
              -q "[.workflow_runs[] | select(.head_repository.full_name == \"$HEAD_REPO\")][0].id")
            if [ "$latest" != "$RUN_ID" ]; then
              echo "Run $latest superseded run $RUN_ID; not rerunning."
              exit 0
            fi
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "No lost runner or mirror outage in attempt $ATTEMPT of run $RUN_ID; not rerunning."
