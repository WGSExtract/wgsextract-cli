name: Rerun Lost Runners

on:
  workflow_run:
    workflows:
      - CI Ubuntu
      - PR area checks
      - CI macOS
      - CI Windows
      - CI Linux ARM64
      - CLI package and benchmark smoke
      - macOS DeepVariant
      - macOS Aligners
      - Linux Aligners
      - Install Lab
      - GUI CI
      - GUI Tauri installer
      - GUI developer setup
      - GUI distribution
    types: [completed]
  schedule:
    - cron: '17 8 * * 1'
  pull_request_target:
    types: [synchronize, closed]

permissions: {}

concurrency:
  group: ci-failure-observer-${{ github.event_name == 'schedule' && 'weekly' || 'observations' }}
  queue: max
  cancel-in-progress: false

jobs:
  rerun:
    # Successful first attempts need no runner. Observe successful retries to
    # report flakes, and main successes to close its workflow-specific bug.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.run_attempt > 1 ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
      issues: write
      pull-requests: read
    steps:
      # Never execute code from the untrusted workflow_run head or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify failures and record bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.ci_failures
          --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"

  clear-old-quarantine:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'ci-red-main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile labels with the PR's live head
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.ci_failures
          --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"

  weekly-rollup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Weekly retry rates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci_failures --repository "$GITHUB_REPOSITORY" --rollup
