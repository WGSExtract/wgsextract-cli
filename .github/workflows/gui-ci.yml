name: GUI CI

# Lint and test the WGS Extract desktop app in gui/. It only runs when the app
# (or its workflows) change; CLI-only changes skip it. CI Ubuntu, which lints
# every workflow, skips app-only changes, so this lints the app's workflows.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "gui/**"
      - ".github/workflows/gui-*.yml"
      - ".github/actions/**"
      - "!gui/mockups/**"
      - "!gui/site_src/**"
      - "!gui/site/**"
      - "!gui/scripts/*site*.py"
      - "!**/*.md"
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: gui

jobs:
  workflows:
    name: GUI workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up lint-only Pixi environment
        uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
      - name: Lint and validate the workflows
        run: |
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py

  checks:
    name: GUI lint and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: gui/app

      # tests/wgsextract parses every bundle command with this checkout's CLI
      # parser (gui/../src), which needs the CLI's Python dependencies.
      - name: Setup Python with the CLI's dependencies
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the CLI's dependencies
        run: python -m pip install --quiet --editable ..

      - name: Lint and test
        run: python3 tools/tasks.py ci

  test:
    name: GUI test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: gui/app

      # tests/wgsextract parses every bundle command with this checkout's CLI
      # parser (gui/../src), which needs the CLI's Python dependencies.
      - name: Setup Python with the CLI's dependencies
        if: runner.os != 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the CLI's dependencies
        if: runner.os != 'Windows'
        run: python -m pip install --quiet --editable ..

      - name: Run tests
        env:
          CHOKIDAR_USEPOLLING: "1"
        run: python3 tools/tasks.py test
