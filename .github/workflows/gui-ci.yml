name: GUI CI

# Lint and test the WGS Extract desktop app in gui/. It only runs when the app
# (or its build inputs) change. CI Ubuntu, which lints every workflow,
# skips app-only changes, so this lints the app's workflows.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main ]
    paths:
      - "gui/**"
      - "scripts/gen_server_openapi.py"
      - "scripts/installlab/gui/wgsextract-plan.json"
      - "src/wgsextract_cli/server/http_api.py"
      - "src/wgsextract_cli/server/transport*.py"
      - "src/wgsextract_cli/core/output_schema.py"
      - ".github/workflows/gui-*.yml"
      - ".github/actions/**"
      - "!gui/mockups/**"
      - "!gui/site_src/**"
      - "!gui/site/**"
      - "!gui/scripts/*site*.py"
      - "!**/*.md"
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:

concurrency:
  group: gui-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: gui

jobs:
  workflows:
    if: ${{ github.event.pull_request.draft != true }}
    name: GUI workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up lint-only Pixi environment
        uses: ./.github/actions/setup-pixi
        with:
          environments: lint
          scope: lint
      - name: Lint and validate the workflows
        run: |
          pixi run -e lint -x actionlint
          pixi run -e lint -x python scripts/validate_github_actions.py

  checks:
    if: ${{ github.event.pull_request.draft != true }}
    name: GUI lint and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/wgsextract parses every bundle command with this checkout's CLI
      # parser (gui/../src), which needs the CLI's Python dependencies.
      - name: Set up the app toolchain
        uses: ./.github/actions/setup-gui
        with:
          npm-install: ci-ignore-scripts
          cli-python: "true"

      - name: Set up cached viewer fixture tools (Linux only)
        uses: ./.github/actions/setup-pixi
        with:
          environments: default
          scope: cli

      - name: Restore Chromium
        id: chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: viewer-chromium-${{ runner.os }}-${{ hashFiles('gui/app/package-lock.json') }}

      - name: Install Chromium and Linux browser libraries
        working-directory: gui/app
        run: npx playwright install --with-deps chromium

      - name: Seed Chromium cache from main
        if: github.ref == 'refs/heads/main' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: viewer-chromium-${{ runner.os }}-${{ hashFiles('gui/app/package-lock.json') }}

      - name: Lint and test
        run: python3 tools/tasks.py ci

      # Direct invocation cannot silently skip if tool/browser provisioning breaks.
      - name: Require the offline viewer memory regression
        working-directory: .
        run: node gui/app/scripts/verify-viewer-offline.mjs --memory --out out/viewer-memory-ci

  test:
    if: ${{ github.event.pull_request.draft != true }}
    name: GUI test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the app toolchain
        uses: ./.github/actions/setup-gui
        with:
          npm-install: ci-ignore-scripts
          cli-python: "true"

      - name: Run tests
        env:
          CHOKIDAR_USEPOLLING: "1"
        run: python3 tools/tasks.py test
