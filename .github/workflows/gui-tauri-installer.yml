name: GUI Tauri installer

# Builds the app's Windows NSIS installer and runs it through install, bundle
# setup, uninstall hooks, and cleanup. Slow, so it only runs when packaging
# inputs change.
on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/gui-tauri-installer.yml"
      - "gui/examples/**"
      - "gui/app/**"
      - "gui/resources/**"
      - "gui/scripts/validate-windows-tauri-lifecycle.ps1"
      - "gui/scripts/windows-admin-task-broker.ps1"
      - "gui/tools/packaging/windows/**"
      - "gui/tools/tasks.py"
      - "!**/*.md"
  push:
    branches: [ main ]
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: gui

jobs:
  windows:
    name: Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci
        working-directory: gui/app

      - name: Cache Cargo downloads (not the redundant multi-GB target tree)
        uses: ./.github/actions/download-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gui/app/web/packagers/tauri/Cargo.lock') }}

      - name: Build Tauri installer
        shell: pwsh
        run: python tools/tasks.py package tauri

      # A release PR pins the bundle to a tag that only exists once it merges;
      # until then, set up the CLI from the commit under test.
      - name: Use this commit's CLI if the pinned release isn't published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tag = (Get-Content examples/WGSExtract/scripts/wgsextract-release-tag.txt -TotalCount 1).Trim()
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "$tag isn't published yet; setup installs the CLI from $env:SHA."
            "WGSEXTRACT_REF=$env:SHA" >> $env:GITHUB_ENV
          }
          exit 0

      - name: Validate install setup uninstall lifecycle via admin broker
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\validate-windows-tauri-lifecycle.ps1 -AutomatedAdmin

      - name: Upload Tauri installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tauri-installer
          path: gui/out/release/tauri/*.exe
          if-no-files-found: error
