name: GUI Tauri installer

# Builds the app's Windows NSIS installer and runs it through install, bundle
# setup, uninstall hooks, and cleanup. Slow, so it only runs when packaging
# inputs change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main ]
    paths:
      - ".github/workflows/gui-tauri-installer.yml"
      - ".github/workflows/gui-build.yml"
      - ".github/actions/rust-cache/**"
      - ".github/actions/setup-gui/**"
      - ".github/actions/download-cache/**"
      - "gui/examples/**"
      - "gui/app/**"
      - "gui/resources/**"
      - "gui/scripts/validate-windows-tauri-lifecycle.ps1"
      - "gui/scripts/windows-process-cleanup.ps1"
      - "gui/scripts/windows-admin-task-broker.ps1"
      - "gui/tools/packaging/windows/**"
      - "gui/tools/tasks.py"
      - "packaging/**"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"
      - "install.sh"
      - "install_windows.bat"
      - "!**/*.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: gui

jobs:
  windows:
    if: ${{ github.event.pull_request.draft != true }}
    name: Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the app toolchain
        uses: ./.github/actions/setup-gui
        with:
          rust: "true"

      - name: Restore Rust dependencies
        uses: ./.github/actions/rust-cache

      - name: Build Tauri installer
        shell: pwsh
        run: python tools/tasks.py package tauri

      # A release PR pins the bundle to a tag that only exists once it merges;
      # until then, set up the CLI from the commit under test.
      - name: Use this commit's CLI if the pinned release isn't published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tag = (Get-Content examples/WGSExtract/scripts/wgsextract-release-tag.txt -TotalCount 1).Trim()
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "$tag isn't published yet; setup installs the CLI from $env:SHA."
            "WGSEXTRACT_REF=$env:SHA" >> $env:GITHUB_ENV
          }
          exit 0

      - name: Validate install setup uninstall lifecycle via admin broker
        shell: pwsh
        run: |
          # Setup scripts run in Windows PowerShell, inheriting this pwsh's module path.
          powershell.exe -NoProfile -Command '$PSVersionTable; [Environment]::Version; Get-Module -ListAvailable Microsoft.PowerShell.Archive | Select-Object Name,Version,Path'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\validate-windows-tauri-lifecycle.ps1 -AutomatedAdmin

      - name: Upload Tauri installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tauri-installer
          path: gui/out/release/tauri/*.exe
          if-no-files-found: error
