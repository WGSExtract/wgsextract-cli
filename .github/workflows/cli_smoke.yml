name: CLI package and benchmark smoke

on:
  push:
    branches: [main]
  workflow_call:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        check: [package, benchmark]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pixi
        with:
          environments: default dev
      - name: Build and Smoke Test Package
        if: matrix.check == 'package'
        run: pixi run package-smoke
      - name: Run Benchmark
        if: matrix.check == 'benchmark'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run wgsextract benchmark --dataset real --profile smoke
