name: CLI package and benchmark smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Lockfile changes require a cold install; PR jobs cannot seed main's cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pixi
        with:
          environments: >-
            default dev vep-rs
            ${{ matrix.os == 'windows-latest' && 'gatk' || '' }}
      - name: Build and Smoke Test Package
        run: pixi run package-smoke
      - name: Run Benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run wgsextract benchmark --dataset real --profile smoke
      - name: Run real-data smoke tests on the benchmark's prepared inputs
        shell: bash
        run: |
          pixi run pytest tests/test_smoke_real_full.py --ci-require-real-data --junitxml=out/real-smoke.xml --durations=60 --basetemp=out/real-smoke-tmp --cov=wgsextract_cli --cov-report=xml:out/real-smoke-coverage.xml
      - name: Publish real-data smoke coverage and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-smoke-${{ matrix.os }}
          path: |
            out/real-smoke.xml
            out/real-smoke-coverage.xml
