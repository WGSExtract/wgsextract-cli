context:
  # native/bwa/CMakeLists.txt's WGSE_BWA_VERSION.
  version: "0.10.0"
  bwa_version: "0.7.19"

package:
  name: wgse-bwa
  version: ${{ version }}

source:
  - path: ../../native
    target_directory: native
  - path: ../../LICENSE
  # The pinned BWA that native/bwa patches (its FetchContent declaration).
  - url: https://github.com/lh3/bwa/archive/refs/tags/v${{ bwa_version }}.tar.gz
    sha256: cdff5db67652c5b805a3df08c4e813a822c65791913eccfb3cf7d528588f37bc
    target_directory: bwa

build:
  number: 0
  string: ${{ target_platform | replace('-', '') }}_wgse_${{ build_number }}
  skip:
    - not (linux and x86_64)
  script:
    - bash "$RECIPE_DIR/build.sh"
  # The CUDA runtime is linked statically, so the package needs only the
  # NVIDIA driver, and only for --cuda: without one, wgse-bwa reports CUDA
  # unavailable and --backend auto aligns on the CPU. Don't require a driver
  # (or a CUDA version) to install it.
  dynamic_linking:
    missing_dso_allowlist:
      - libcuda.so.1
  ignore_run_exports:
    from_package:
      - ${{ compiler('cuda') }}
    by_name:
      - cuda-version

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib('c') }}
    - cmake >=3.24
    - ninja
  host:
    - cuda-version ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev
    - cuda-cudart-static
    - zlib

tests:
  - script:
      - wgse-bwa --version
      - wgse-bwa capabilities --json
      - wgse-bwa capabilities --json | grep -q '"cuda_hardware_supported":'
  - files:
      source:
        - native/tests/smoke.sh
    requirements:
      run:
        - gawk
    script:
      # Indexes and aligns a synthetic genome on the CPU, and on the GPU too
      # when the build machine has one.
      - bash native/tests/smoke.sh "$(command -v wgse-bwa)" smoke metal

about:
  homepage: https://github.com/WGSExtract/wgsextract-cli/tree/main/native
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - bwa/COPYING
    - native/bwa/SEEDING-LICENSE
  summary: >-
    BWA 0.7.19 rebuilt by WGS Extract, with an experimental CUDA backend
    (--cuda, --backend auto) that writes BWA's exact alignments.
