context:
  version: "1.25"
  mimalloc_version: "3.6.1"

package:
  name: bcftools
  version: ${{ version }}

source:
  - url: https://github.com/samtools/bcftools/releases/download/${{ version }}/bcftools-${{ version }}.tar.bz2
    sha256: f96e583d2315998645bb56756f1c8f230c489512db2655b0f623198ebc8a2d99
    patches:
      - patches/0001-bounded-cram-stop-copy.patch
      - patches/0002-vector-bam-sequence-packing.patch
      - patches/0003-reuse-cram-buffers.patch
      - patches/0004-bulk-copy-single-sample.patch
  - url: https://github.com/microsoft/mimalloc/archive/v${{ mimalloc_version }}.tar.gz
    sha256: 2672e6a99d4579fb4bb32d9de0d63aa424ce600d31fbfaf06eb74d940d2e07a6
    target_directory: mimalloc

build:
  number: 0
  string: wgse_${{ build_number }}
  script:
    # MSYS2 UCRT64 builds it (see ../env.sh); MSYS2_ROOT says where it is.
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

tests:
  - script:
      - bcftools --version

about:
  homepage: https://www.htslib.org
  license: MIT
  license_file:
    - LICENSE
    - mimalloc/LICENSE
  summary: bcftools, built natively for Windows by WGS Extract (static htslib and guarded mimalloc).
