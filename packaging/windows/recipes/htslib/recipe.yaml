context:
  version: "1.25"

package:
  name: htslib
  version: ${{ version }}

source:
  url: https://github.com/samtools/htslib/releases/download/${{ version }}/htslib-${{ version }}.tar.bz2
  sha256: 158c271e4e2986bb2dd11283b640edc10c56695b293df77a109ce99480303730
  patches:
    - patches/0001-bounded-cram-stop-copy.patch
    - patches/0002-vector-bam-sequence-packing.patch
    # GLIMPSE2 and Windows ARM64 still use the htslib 1.24 inflate path.
    - patches/1.25/0003-reuse-cram-buffers.patch

build:
  number: 0
  string: wgse_${{ build_number }}
  script:
    # MSYS2 UCRT64 builds it (see ../env.sh); MSYS2_ROOT says where it is.
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

tests:
  - script:
      - bgzip --version
      - tabix --version
      - htsfile --version

about:
  homepage: https://www.htslib.org
  license: MIT
  license_file: LICENSE
  summary: htslib's bgzip, tabix and htsfile, built natively for Windows by WGS Extract.
