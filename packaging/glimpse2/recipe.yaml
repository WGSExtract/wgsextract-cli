context:
  version: "2.0.1"
  htslib: "1.24"

package:
  name: glimpse-bio
  version: ${{ version }}

source:
  - url: https://github.com/odelaneau/GLIMPSE/archive/refs/tags/v${{ version }}.tar.gz
    sha256: dcdc06fc85ca9bae6a2255caf3f985a5e6ccab5a99a0c3fe4c2fd7f8d27b0b8e
    patches:
      - patches/0001-native-windows-environment.patch
  - url: https://github.com/samtools/htslib/releases/download/${{ htslib }}/htslib-${{ htslib }}.tar.bz2
    sha256: 28a8de191381c7a97a35675ceac76fa1ea95e7b678d6a2e9d600a7874e4077de
    target_directory: htslib-${{ htslib }}
    patches:
      - ../windows/recipes/htslib/patches/0001-bounded-cram-stop-copy.patch
      - ../windows/recipes/htslib/patches/0002-vector-bam-sequence-packing.patch
      - ../windows/recipes/htslib/patches/0003-reuse-cram-buffers.patch

build:
  number: 1
  string: win64_wgse_${{ build_number }}
  script:
    # MSYS2 UCRT64 builds it (see ../windows/recipes/env.sh); MSYS2_ROOT says where it is.
    env:
      MSYS2_ROOT: ${{ env.get("MSYS2_ROOT", default="C:\\msys64") }}
    content:
      - '"%MSYS2_ROOT%\usr\bin\bash.exe" "%RECIPE_DIR%\build.sh"'

tests:
  - script:
      - GLIMPSE2_phase --help
      - GLIMPSE2_ligate --help
      - GLIMPSE2_chunk --help
      - GLIMPSE2_split_reference --help
      - GLIMPSE2_concordance --help

about:
  homepage: https://github.com/odelaneau/GLIMPSE
  license: MIT
  license_file: LICENSE
  summary: >-
    GLIMPSE2 low-coverage imputation (phase, ligate, chunk, split_reference,
    concordance), built natively for Windows by WGS Extract (static, with
    htslib, Boost and the compression libraries linked in).
